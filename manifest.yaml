name: dbview
version: 0.2.0
description: "Database visualisation + Natural-Language-to-Query workbench for 18\
  \ engines (PostgreSQL, MySQL, MariaDB, MSSQL, SQLite, Oracle, ClickHouse, DuckDB,\
  \ CockroachDB, Neo4j, FalkorDB, Ultipa, MongoDB, Redis, Elasticsearch, Qdrant, Salesforce,\
  \ Salesforce Data Cloud). Bundles the upstream dbview NestJS API and React/Vite\
  \ SPA verbatim under ``dbview/``; the plugin process-supervises the Node backend\
  \ and fronts it with an authenticated FastAPI reverse proxy at ``/api/dbview`` (built\
  \ SPA served at ``/dbview``). Identity, RBAC and tenancy are centralised in the\
  \ platform ``auth`` plugin via a trusted-gateway seam \u2014 dbview's local login\
  \ is disabled and users are JIT-mirrored from the central identity provider."
author: BaselithCore Team
homepage: https://github.com/giovanni-ippolito/dbview
license: LicenseRef-Proprietary
min_core_version: 1.0.0
category: Knowledge
readiness: beta
tenancy: shared
tags:
- database
- nl2sql
- nl2cypher
- soql
- visualisation
- postgres
- neo4j
- mongo
- elasticsearch
- qdrant
- salesforce
- sso
integrity_sha256: 40300281366c75f2e32a7de1ac2e66bd25f2bcca40774363fea05f0a0793dd49
llm_scopes:
- id: nl2sql
  label: "NL\u2192Query translation"
- id: explain
  label: Explain / summarize
optional_resources:
- llm
- postgres
plugin_dependencies:
  auth: '>=2.0.0'
python_dependencies:
- httpx>=0.27.0
runtime_prerequisites:
- "Node.js \u2265 20 on PATH (mandatory; \u2265 22.13 only if pnpm is upgraded to\
  \ 11.x)"
- "pnpm (auto-provisioned as 10.15.0 via the packageManager field; Node-20 compatible).\
  \ Corepack/pnpm self-manage the version \u2014 do not pin pnpm 11.x while on Node\
  \ 20 (pnpm 11 requires Node \u2265 22.13). Needed for DBVIEW_PLUGIN_MODE=dev and\
  \ builds."
- "apps/api/dist/main.js built (prod mode \u2014 run `pnpm install && pnpm -r build`\
  \ once)"
- "apps/web/dist/index.html built for the SPA \u2014 `VITE_API_BASE_URL=/api/dbview\
  \ VITE_BASE_PATH=/dbview/ VITE_AUTH_MODE=gateway pnpm --filter @dbview/web build`"
environment_variables:
- name: DBVIEW_SECRET
  description: "AES-256-GCM key for stored connection strings, \u2265 16 chars. Mandatory\
    \ and must stay stable across restarts."
  required: true
- name: DBVIEW_JWT_SECRET
  description: "Local JWT signing key (\u2265 32 chars). Optional under central gateway\
    \ auth \u2014 auto-generated per boot when unset (the local login flow is disabled)."
  required: false
- name: DBVIEW_DATA_DIR
  description: Runtime data directory (users/sessions/connections/history JSON stores).
    Default ``plugins/dbview/var/data``.
  required: false
- name: DBVIEW_PLUGIN_MODE
  description: '``prod`` (default, runs node dist/main.js) or ``dev`` (runs pnpm dev).'
  required: false
- name: DBVIEW_INTERNAL_HOST
  description: Bind host for the embedded Node API. Default ``127.0.0.1``.
  required: false
- name: DBVIEW_INTERNAL_PORT
  description: Bind port for the embedded Node API. Default = ephemeral allocation.
  required: false
- name: DBVIEW_STARTUP_TIMEOUT_S
  description: Max seconds the supervisor waits for /api/health before failing. Default
    90.
  required: false
- name: DBVIEW_RESTART_MAX_ATTEMPTS
  description: Cap on consecutive child restarts (0 = unlimited). Default 0.
  required: false
- name: DBVIEW_API_KEY
  description: Optional upstream service key (Prometheus scrape / CI automation hitting
    the loopback API directly). Central platform API keys (bsk_) work through the
    proxy.
  required: false
- name: OLLAMA_BASE_URL
  description: "Local Ollama endpoint for NL\u2192Query (default http://localhost:11434/api)."
  required: false
- name: OPENAI_API_KEY
  description: "Optional OpenAI provider for NL\u2192Query."
  required: false
- name: ANTHROPIC_API_KEY
  description: "Optional Anthropic provider for NL\u2192Query."
  required: false
- name: OTEL_EXPORTER_OTLP_ENDPOINT
  description: OTLP collector base URL. Tracing is a no-op when unset.
  required: false
