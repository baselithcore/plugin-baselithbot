id: react2shell
name: React2Shell (Next.js)
description: Honeypot emulating a vulnerable React Server Components (Next.js) endpoint to detect CVE-2025-55182 exploitation attempts.
protocol: http
port: 3000
handler_type: custom
custom_handler_class: plugins.honeypot.custom_handlers.react_flight_handler.ReactFlightHandler
enabled: false
tags:
  - cve-2025-55182
  - rce
  - nextjs
  - react
  - exploit

detection:
  sql_injection: true
  command_injection: true
  path_traversal: true
  xss: true
  custom_patterns:
    - name: react_flight_prototype_pollution
      regex: '(?i)(\$1:__proto__|:constructor:constructor)'
      severity: critical
      category: exploit_attempt
    - name: react_flight_chunks
      regex: '(?i)(\"\$@\d+\"|\"status\":\s*\"resolved_model\")'
      severity: critical
      category: exploit_attempt

response_mode: 'static'

honeydoc:
  personality: 'ubuntu-server-22'
  stealth_delay_ms: 100
  custom_fingerprint:
    http_server: 'Next.js'
