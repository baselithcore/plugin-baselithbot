# Elasticsearch Server Honeypot
# Simulates an Elasticsearch REST API for capturing data exfiltration attempts

id: 'elasticsearch'
name: 'Elasticsearch API'
description: 'HTTP honeypot simulating Elasticsearch 8.x REST API without authentication'
protocol: 'http'
port: 9200
bind_address: '0.0.0.0'
handler_type: 'http'

http_config:
  site_type: 'custom'
  custom_headers:
    Server: ''
    X-Elastic-Product: 'Elasticsearch'
    Content-Type: 'application/json'

  routes:
    - path: '/'
      status_code: 200
      response_content: |
        {
          "name" : "elasticsearch-node-1",
          "cluster_name" : "production-cluster",
          "cluster_uuid" : "abc123def456",
          "version" : {
            "number" : "8.11.0",
            "build_flavor" : "default",
            "build_type" : "docker",
            "build_hash" : "abc123",
            "build_date" : "2024-01-15T10:00:00.000Z",
            "build_snapshot" : false,
            "lucene_version" : "9.8.0",
            "minimum_wire_compatibility_version" : "7.17.0",
            "minimum_index_compatibility_version" : "7.0.0"
          },
          "tagline" : "You Know, for Search"
        }
    - path: '/_cat/indices'
      status_code: 200
      response_content: |
        green open users             abc123 1 1   5421  0   2.4mb   1.2mb
        green open logs-2024         def456 1 1 125890  0  45.2mb  22.6mb
        green open customers         ghi789 1 1  12345  0   8.1mb   4.0mb
        green open credit-cards      jkl012 1 1   8901  0   3.2mb   1.6mb
    - path: '/_search'
      status_code: 200
      response_content: |
        {"took":5,"timed_out":false,"hits":{"total":{"value":0},"hits":[]}}
    - path: '/_all/_search'
      status_code: 200
      response_content: |
        {"took":10,"timed_out":false,"hits":{"total":{"value":0},"hits":[]}}

detection:
  log_all_requests: true
  alert_paths:
    - '/_search'
    - '/_all'
    - '/_cat'
    - '/_mapping'
    - '/_cluster'
    - '/users'
    - '/customers'
    - '/credit-cards'
  alert_query_params:
    - 'q='
    - 'query'
  severity_boost:
    - pattern: 'credit-cards'
      boost: 'critical'
    - pattern: '_search'
      boost: 'high'

response_mode: 'static'
tags: ['http', 'elasticsearch', 'api', 'database']
enabled: false
priority: 6
