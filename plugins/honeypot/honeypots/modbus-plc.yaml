# Modbus TCP PLC Honeypot
# Emulates a Siemens S7-1200 PLC with Modbus TCP gateway
# Default port: 502

id: modbus-plc
name: 'Modbus TCP PLC'
description: 'Industrial PLC simulator exposing a Modbus TCP interface for ICS/SCADA reconnaissance detection'
protocol: modbus
port: 502
handler_type: modbus
enabled: true

tags:
  - ics
  - scada
  - plc
  - modbus
  - iot

modbus_config:
  unit_id: 1
  device_identification: 'Siemens S7-1200 / Modbus TCP Gateway'
  supported_function_codes:
    - 1 # Read Coils
    - 2 # Read Discrete Inputs
    - 3 # Read Holding Registers
    - 4 # Read Input Registers
    - 5 # Write Single Coil
    - 6 # Write Single Register
    - 15 # Write Multiple Coils
    - 16 # Write Multiple Registers

  # Simulated register map (water treatment plant scenario)
  holding_registers:
    # Process variables
    0: 0 # System status (0=standby)
    1: 100 # Tank level (%)
    2: 250 # Flow rate (L/min)
    3: 0 # Alarm status
    4: 1 # Mode (0=manual, 1=auto)
    # Setpoints
    100: 2400 # Pressure setpoint (mbar)
    101: 500 # Temperature setpoint (0.1°C)
    102: 60 # Speed setpoint (Hz)
    # Diagnostics
    200: 0 # Error code
    201: 1 # Firmware version

  # Coil states
  coils:
    0: true # Pump 1 running
    1: false # Pump 2 standby
    2: true # Valve 1 open
    3: true # Valve 2 open
    4: false # Emergency stop (not engaged)

# Detection rules for ICS-specific attacks
detection:
  patterns:
    - name: 'register_scan'
      pattern: 'FC3.*quantity>50'
      severity: 'high'
      description: 'Large register read — possible reconnaissance'

    - name: 'coil_write'
      pattern: 'FC5|FC15'
      severity: 'critical'
      description: 'Coil write attempt — potential process manipulation'

    - name: 'register_overwrite'
      pattern: 'FC6|FC16'
      severity: 'critical'
      description: 'Register write attempt — potential setpoint tampering'

# Stealth configuration
stealth:
  enabled: true
  response_delay_ms: 25 # Realistic PLC response time
  jitter_ms: 10
