# MQTT Broker Honeypot
# Emulates an Eclipse Mosquitto MQTT broker for IoT attack detection
# Default port: 1883

id: mqtt-broker
name: 'MQTT IoT Broker'
description: 'IoT MQTT broker simulator for detecting unauthorized device connections, topic snooping, and command injection'
protocol: mqtt
port: 1883
handler_type: mqtt
enabled: true

tags:
  - iot
  - mqtt
  - broker
  - industrial
  - smart-factory

mqtt_config:
  broker_name: 'Eclipse Mosquitto/2.0.18'
  allow_anonymous: true
  max_qos: 2

  valid_credentials:
    - username: admin
      password: admin
    - username: device
      password: device123
    - username: sensor_gw
      password: s3nsor!2025
    - username: plc_bridge
      password: bridge@factory

  # Topic patterns to monitor for ICS/IoT activity
  monitored_topics:
    - 'factory/#' # Factory floor data
    - 'plc/#' # PLC telemetry
    - 'sensor/#' # Sensor readings
    - 'actuator/#' # Actuator commands
    - '$SYS/#' # Broker internals (recon indicator)
    - 'cmd/#' # Command topics (high-risk)
    - 'firmware/#' # Firmware update topics (critical)
    - 'config/#' # Configuration topics
    - 'alarm/#' # Alarm system topics

# Detection rules for MQTT-specific attacks
detection:
  patterns:
    - name: 'sys_topic_recon'
      pattern: "\\$SYS"
      severity: 'high'
      description: 'Subscription to $SYS topics — broker reconnaissance'

    - name: 'firmware_publish'
      pattern: 'firmware/'
      severity: 'critical'
      description: 'Publish to firmware topic — potential device tampering'

    - name: 'cmd_injection'
      pattern: 'cmd/'
      severity: 'critical'
      description: 'Publish to command topic — potential actuator manipulation'

    - name: 'wildcard_subscribe'
      pattern: '^#$'
      severity: 'medium'
      description: 'Wildcard subscription — broad data harvesting'

# Stealth configuration
stealth:
  enabled: true
  response_delay_ms: 15 # Fast broker response
  jitter_ms: 5
