# Cloud Management API Honeypot
# High-interaction honeypot simulating AWS-like cloud management APIs
# Targets APT actors, cloud-specific attacks, and zero-day pattern capture

id: 'cloud-management-api'
name: 'Cloud Management API (AWS-like)'
description: 'High-interaction honeypot simulating AWS IAM, S3, STS, Secrets Manager APIs for detecting cloud-focused APT activity, privilege escalation, and data exfiltration attempts'
protocol: 'http'
port: 8443
bind_address: '0.0.0.0'
handler_type: 'cloud'  # Uses CloudManagementHandler

# Cloud-specific configuration
cloud_config:
  provider: 'aws'
  region: 'eu-south-1'  # Milano, Italy

  # Simulated services
  enabled_services:
    - 'iam'        # Identity and Access Management
    - 's3'         # Object Storage
    - 'sts'        # Security Token Service
    - 'secretsmanager'  # Secrets Management
    - 'ec2'        # Compute (metadata only)
    - 'kms'        # Key Management (limited)

  # Authentication simulation
  auth_config:
    accept_any_signature: true  # Accept any AWS signature for session tracking
    capture_credentials: true
    max_auth_failures: 5
    weak_keys_for_baiting:
      - 'AKIAEXAMPLEKEY12345'
      - 'ASIAEXAMPLETEMP12345'

  # IMDS (Instance Metadata Service) simulation for SSRF detection
  imds_enabled: true
  imds_version: 'v1'  # Intentionally vulnerable for detection

  # Response realism
  response_config:
    include_request_ids: true
    simulate_latency_ms: 50
    error_message_verbosity: 'detailed'  # Realistic AWS error messages

# HTTP configuration
http_config:
  routes:
    # Root endpoint - service discovery
    - path: '/'
      method: ['GET', 'POST']

    # IAM endpoints
    - path: '/iam/{action:.*}'
      method: ['GET', 'POST']

    # S3 endpoints
    - path: '/s3/{bucket:.*}'
      method: ['GET', 'PUT', 'POST', 'DELETE', 'HEAD']

    # STS endpoints
    - path: '/sts/{action:.*}'
      method: ['GET', 'POST']

    # Secrets Manager endpoints
    - path: '/secretsmanager/{action:.*}'
      method: ['GET', 'POST']

    # IMDS endpoints (for SSRF detection)
    - path: '/latest/meta-data/{path:.*}'
      method: ['GET']

    - path: '/latest/api/token'
      method: ['PUT']

    # Health check (legitimate)
    - path: '/health'
      method: ['GET']
      response_content: '{"status": "healthy"}'

# Attack pattern detection
detection:
  log_all_requests: true

  # High-value action patterns
  alert_actions:
    # IAM privilege escalation
    - 'CreateUser'
    - 'CreateRole'
    - 'AttachUserPolicy'
    - 'AttachRolePolicy'
    - 'CreateAccessKey'
    - 'UpdateAssumeRolePolicy'
    - 'CreatePolicyVersion'
    - 'PutUserPolicy'
    - 'PutRolePolicy'

    # Credential access
    - 'GetSecretValue'
    - 'GetParameter'
    - 'Decrypt'

    # Data exfiltration
    - 'GetObject'
    - 'ListObjects'
    - 'ListObjectsV2'

    # Lateral movement
    - 'AssumeRole'
    - 'GetSessionToken'
    - 'GetFederationToken'

  # Path-based alerts
  alert_paths:
    - '/latest/meta-data'
    - '/iam/'
    - '/secretsmanager/'
    - '/_cat/'
    - '/.git'
    - '/.env'

  # Query parameter patterns
  alert_query_params:
    - 'Action='
    - 'RoleArn='
    - 'SecretId='
    - 'PolicyArn='

  # Custom pattern rules
  custom_patterns:
    - name: 'imds_credential_theft'
      regex: '169\.254\.169\.254.*security-credentials'
      severity: 'critical'
      category: 'credential_theft'

    - name: 'iam_privesc_chain'
      regex: '(CreateUser|CreateRole).*AttachUserPolicy'
      severity: 'critical'
      category: 'privilege_escalation'

    - name: 'aws_key_in_payload'
      regex: 'AKIA[0-9A-Z]{16}'
      severity: 'high'
      category: 'credential_exposure'

    - name: 's3_bucket_scan'
      regex: 'ListBuckets|ListAllMyBuckets'
      severity: 'medium'
      category: 'reconnaissance'

    - name: 'ssrf_internal_ip'
      regex: '(127\.0\.0\.1|10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+)'
      severity: 'high'
      category: 'ssrf'

  # Severity boost rules
  severity_boost:
    - pattern: 'security-credentials'
      boost: 'critical'
    - pattern: 'GetSecretValue'
      boost: 'critical'
    - pattern: 'CreateAccessKey'
      boost: 'critical'
    - pattern: 'AssumeRole'
      boost: 'high'
    - pattern: 'ListUsers'
      boost: 'medium'

# Session state machine configuration
state_machine:
  enabled: true
  max_session_duration_minutes: 30
  max_auth_attempts: 5

  # State transition hooks
  high_risk_states:
    - 'exfiltrating'
    - 'privilege_escalation'
    - 'lateral_movement'

  # Alert on specific transitions
  alert_transitions:
    - from: 'authenticated'
      to: 'privilege_escalation'
      severity: 'high'
    - from: 'exploring'
      to: 'exfiltrating'
      severity: 'critical'

# Heuristic zero-day detection
heuristics:
  enabled: true

  # Enabled heuristic rules
  rules:
    - name: 'machine_timing'
      enabled: true
      threshold_ms: 100
    - name: 'burst_requests'
      enabled: true
      window_seconds: 5
      threshold: 20
    - name: 'privesc_sequence'
      enabled: true
    - name: 'unusual_service_combo'
      enabled: true
    - name: 'encoded_payload'
      enabled: true
    - name: 'rapid_state_transitions'
      enabled: true
      max_per_minute: 10
    - name: 'high_error_rate'
      enabled: true
      threshold_percent: 70
    - name: 'abnormal_data_volume'
      enabled: true
      threshold_mb: 100

  # Zero-day flagging
  zero_day_threshold: 0.8
  alert_on_zero_day_candidate: true

# Forensic capture settings
forensics:
  # TCP/TLS fingerprinting
  tcp_fingerprint: true
  tls_fingerprint: true
  ja4_fingerprint: true

  # Request timing analysis
  timing_analysis: true
  timing_window_requests: 100

  # Credential capture
  capture_credentials: true
  redact_in_logs: true

  # Full request logging
  log_request_body: true
  max_body_log_size: 65536

  # Session behavioral profile
  behavioral_profiling: true

# HoneyDOC integration
honeydoc:
  personality: 'aws-api'
  stealth_delay_ms: 50
  flow_action_override: null

  custom_fingerprint:
    http_server: ''
    tls_version: 'TLSv1.3'
    cipher_suites: 'TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256'

# Response mode
response_mode: 'llm'

# Tags for categorization
tags:
  - 'http'
  - 'cloud'
  - 'aws'
  - 'api'
  - 'iam'
  - 's3'
  - 'secrets'
  - 'high-interaction'
  - 'apt'

# Enable by default
enabled: true

# High priority (loaded before generic HTTP)
priority: 10
