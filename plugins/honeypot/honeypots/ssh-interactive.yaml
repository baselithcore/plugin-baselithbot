# SSH Interactive Honeypot
# Inspired by Beelzebub's interactive SSH configuration
# Simulates a Linux server with common command responses

id: 'ssh-interactive'
name: 'SSH Interactive Server'
description: 'Interactive SSH honeypot that simulates a Linux server with pre-defined command responses'
protocol: 'ssh'
port: 2223
bind_address: '0.0.0.0'
handler_type: 'ssh'

ssh_config:
  version: 'OpenSSH_8.9p1 Ubuntu-3ubuntu0.6'
  server_name: 'ubuntu-server'
  allowed_passwords:
    - 'root'
    - 'qwerty'
    - '123456'
    - 'password'
    - 'admin'
    - 'jenkins'
    - 'postgres'
    - 'minecraft'
  max_auth_attempts: 6
  motd: 'Welcome to Ubuntu 22.04.3 LTS (GNU/Linux 5.15.0-88-generic x86_64)'

detection:
  command_injection: true
  path_traversal: true
  sql_injection: false
  xss: false
  custom_patterns:
    - name: dangerous_commands
      regex: '(rm\s+-rf|chmod\s+777|nc\s+-e)'
      severity: critical
      category: command_injection
    - name: download_attempts
      regex: '(curl|wget)\s+https?://'
      severity: high
      category: malware_delivery
    - name: credential_access
      regex: 'cat.*/etc/(passwd|shadow)'
      severity: high
      category: credential_harvesting

response_mode: 'static'
tags: ['ssh', 'linux', 'interactive', 'ubuntu']
enabled: false
priority: 5
