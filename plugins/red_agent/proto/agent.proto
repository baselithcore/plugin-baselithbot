// SPDX-License-Identifier: Apache-2.0
//
// Red Agent endpoint daemon ↔ backend wire protocol.
//
// This file is the single source of truth for the protocol shared by
// the server-side `red_agent` plugin and the standalone Rust daemon
// (`baselith-redagent-daemon`). It is mirrored into the daemon repo
// via git subtree on each release. Edits land here first.
//
// Versioning policy:
//   - Backwards-compatible additions (new fields with new tag numbers,
//     new oneof variants, new enum values) DO NOT bump
//     `protocol_version`.
//   - Wire-incompatible changes (renumbered fields, removed fields,
//     changed types) DO bump `protocol_version` and require a
//     coordinated server + agent rollout window.
//
// Compatibility rules (enforced by review):
//   - Never reuse a deprecated field tag.
//   - Never change a field's type or cardinality in place.
//   - Add a new field with a new tag and deprecate the old one.

syntax = "proto3";

package baselith.red_agent.v1;

option go_package      = "github.com/baselithcore/redagent/proto/v1;agentv1";
option java_package    = "io.baselith.redagent.v1";
option csharp_namespace = "Baselith.RedAgent.V1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

// AgentChannel is the only RPC surface the daemon uses after enrollment.
// One bidirectional stream per agent, kept alive for the agent's lifetime.
//
// Authentication: mTLS 1.3 with ed25519 client cert. The server extracts
// `tenant_id` and `agent_uuid` from the SPIFFE-style URI SAN
// (`spiffe://baselith.io/tenant/{tenant_id}/agent/{agent_uuid}`) — never
// from message contents.
//
// Enrollment is a separate REST endpoint
// (`POST /red-agent/agents/enroll`) that issues the cert. See
// `plugins/red_agent/docs/agent_daemon.md` §6.3.
service AgentChannel {
  // Single bidirectional stream per agent. The method is named
  // `OpenStream` (not `Connect`) because tonic auto-generates a
  // transport-level `Client::connect()` constructor; a user RPC by
  // the same name collides with that helper.
  rpc OpenStream(stream AgentMessage) returns (stream ServerMessage);
}

// ---------------------------------------------------------------------------
// Envelope
// ---------------------------------------------------------------------------

// Every message on the stream is wrapped in an envelope. `seq` is a
// per-direction monotonic counter starting at 1; it gives the receiver
// a way to detect drops, gaps, and replays. `nonce` is a 16-byte
// random value the receiver tracks within a sliding window to reject
// replays of captured-but-not-yet-delivered messages.
message AgentMessage {
  uint64 seq                 = 1;
  bytes  nonce               = 2;
  google.protobuf.Timestamp ts = 3;

  oneof payload {
    AgentHello       hello              = 10;
    Heartbeat        heartbeat          = 11;
    TelemetryBatch   telemetry          = 12;
    CommandResult    command_result     = 13;
    LogBatch         logs               = 14;
    PolicyAck        policy_ack         = 15;
    RotationRequest  rotation_request   = 16;
    DisconnectNotice disconnect_notice  = 17;
  }
}

message ServerMessage {
  uint64 seq                 = 1;
  bytes  nonce               = 2;
  google.protobuf.Timestamp ts = 3;

  oneof payload {
    ServerHello      hello              = 10;
    Heartbeat        heartbeat          = 11;
    Command          command            = 12;
    PolicyUpdate     policy             = 13;
    RotationGrant    rotation_grant     = 14;
    Disconnect       disconnect         = 15;
  }
}

// ---------------------------------------------------------------------------
// Handshake & capability negotiation
// ---------------------------------------------------------------------------

// AgentHello is the first message on every new stream. It MUST be
// followed by a ServerHello before any other traffic flows.
message AgentHello {
  // Protocol wire version. Bump only on wire-incompatible changes.
  uint32 protocol_version = 1;

  // Daemon semver. Informational; does not gate connection.
  string daemon_version   = 2;

  // Stable per-host UUID. Persisted on disk; survives reboot, OS
  // upgrade, and cert rotation. Regenerated only on factory reset.
  string agent_uuid       = 3;

  Platform platform       = 4;

  // Feature flags the daemon can perform on this host. The server
  // narrows policy to the intersection of declared capabilities and
  // server-side feature gating.
  repeated AgentCapability capabilities = 5;

  // Last `seq` the agent successfully ACKed before the previous
  // disconnect, if any. Allows the server to skip already-delivered
  // commands. Zero on first connect.
  uint64 last_acked_server_seq = 6;
}

message ServerHello {
  // Lowest protocol_version the server still accepts. If the agent's
  // version is below this, the server sends Disconnect{INCOMPATIBLE}
  // immediately after this hello.
  uint32 protocol_version_min = 1;

  // Effective set of capabilities (intersection of agent-declared and
  // server-allowed for this tenant).
  repeated AgentCapability capabilities = 2;

  // Heartbeat interval the server expects from this agent.
  google.protobuf.Duration heartbeat_interval = 3;

  // Maximum number of TelemetryEvent entries per TelemetryBatch.
  uint32 telemetry_batch_max = 4;

  // Maximum bytes per single message on this stream.
  uint32 message_size_max_bytes = 5;

  // Tenant_id echoed for diagnostics. Server still enforces tenancy
  // from the peer cert SAN — this field is informational only.
  string tenant_id_echo = 6;
}

message Platform {
  enum OS {
    OS_UNSPECIFIED = 0;
    OS_LINUX       = 1;
    OS_MACOS       = 2;
    OS_WINDOWS     = 3; // future
  }

  OS     os                = 1;
  string os_version        = 2; // e.g. "Ubuntu 24.04", "macOS 15.4"
  string kernel_version    = 3; // e.g. "6.8.0-31-generic", "Darwin 25.4.0"
  string arch              = 4; // "x86_64", "aarch64"
  string hostname          = 5; // best-effort; not trusted for identity
  string boot_id           = 6; // /proc/sys/kernel/random/boot_id (linux)
                                // or kern.bootsessionuuid (macOS)
  uint64 cpu_count         = 7;
  uint64 mem_total_bytes   = 8;
}

enum AgentCapability {
  CAPABILITY_UNSPECIFIED        = 0;

  // Telemetry surfaces.
  CAPABILITY_PROC_INVENTORY     = 1; // process list snapshot
  CAPABILITY_PKG_INVENTORY      = 2; // installed packages (apt/rpm/brew)
  CAPABILITY_FILE_HASH          = 3; // on-demand SHA-256 hashing
  CAPABILITY_NET_LISTEN         = 4; // listening sockets snapshot
  CAPABILITY_USER_INVENTORY     = 5; // local users / groups
  CAPABILITY_EBPF_EXEC          = 10; // linux: tracepoint/sched_process_exec
  CAPABILITY_EBPF_OPEN          = 11; // linux: tracepoint/syscalls/sys_enter_openat
  CAPABILITY_EBPF_CONNECT       = 12; // linux: kprobe/tcp_connect
  CAPABILITY_ESF_EXEC           = 20; // macOS: ES_EVENT_TYPE_NOTIFY_EXEC
  CAPABILITY_ESF_FILE           = 21; // macOS: ES_EVENT_TYPE_NOTIFY_OPEN/WRITE

  // Local execution surfaces.
  CAPABILITY_SCAN_LOCAL_TRIVY   = 30;
  CAPABILITY_SCAN_LOCAL_NMAP    = 31;
  CAPABILITY_SCAN_LOCAL_NUCLEI  = 32;
  CAPABILITY_SCAN_LOCAL_SECRETS = 33; // gitleaks-style on-disk scan

  // Sandboxing primitives the daemon can apply to local scanners.
  CAPABILITY_SANDBOX_LANDLOCK   = 40; // linux ≥ 5.13
  CAPABILITY_SANDBOX_SECCOMP    = 41;
  CAPABILITY_SANDBOX_SBX_EXEC   = 42; // macOS sandbox-exec

  // Self-update.
  CAPABILITY_SELF_UPDATE        = 50;
}

// ---------------------------------------------------------------------------
// Heartbeat
// ---------------------------------------------------------------------------

message Heartbeat {
  // Lightweight liveness signal. Sent in both directions.
  // Health and load metrics piggyback so the fleet UI does not need
  // a separate poll path.
  HealthSnapshot health = 1;
}

message HealthSnapshot {
  double cpu_percent          = 1;
  uint64 mem_rss_bytes        = 2;
  uint64 disk_free_bytes      = 3;
  uint64 telemetry_buffer_lag = 4; // events queued locally not yet sent
  google.protobuf.Duration uptime = 5;
}

// ---------------------------------------------------------------------------
// Telemetry
// ---------------------------------------------------------------------------

message TelemetryBatch {
  // Batch ID for ACK reference. UUIDv4.
  string batch_id = 1;

  repeated TelemetryEvent events = 2;
}

message TelemetryEvent {
  google.protobuf.Timestamp observed_at = 1;

  // Stable, namespaced kind string. Examples:
  //   "process.exec", "file.write", "net.connect", "pkg.installed",
  //   "user.login", "scan.finding".
  // Free-form so we can extend without bumping protocol_version.
  string kind = 2;

  // Severity hint, primarily for UI prioritization. The server's
  // policy engine remains authoritative.
  Severity severity = 3;

  // Event payload. Schema is per-`kind`; documented in the daemon
  // repo under `docs/telemetry-kinds.md`. Use a Struct so clients
  // can evolve event shapes without proto regeneration on every
  // change.
  google.protobuf.Struct attributes = 4;

  // If the event correlates to an active scan or command, set this.
  // Otherwise empty.
  string correlation_id = 5;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO        = 1;
  SEVERITY_LOW         = 2;
  SEVERITY_MEDIUM      = 3;
  SEVERITY_HIGH        = 4;
  SEVERITY_CRITICAL    = 5;
}

// ---------------------------------------------------------------------------
// Logs (daemon's own structured logs, not host telemetry)
// ---------------------------------------------------------------------------

message LogBatch {
  repeated LogEntry entries = 1;
}

message LogEntry {
  google.protobuf.Timestamp ts = 1;
  LogLevel                 level = 2;
  string                   target = 3;  // module path, e.g. "collector::ebpf"
  string                   message = 4;
  google.protobuf.Struct   fields = 5;  // structured key/values
  string                   trace_id = 6; // W3C traceparent if available
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_TRACE       = 1;
  LOG_LEVEL_DEBUG       = 2;
  LOG_LEVEL_INFO        = 3;
  LOG_LEVEL_WARN        = 4;
  LOG_LEVEL_ERROR       = 5;
}

// ---------------------------------------------------------------------------
// Commands (server → agent)
// ---------------------------------------------------------------------------

message Command {
  // Idempotency: if the agent has already processed a command with
  // this key in the last 24 h, it MUST return the cached result and
  // NOT re-execute. Required.
  string idempotency_key = 1;

  // For correlating telemetry events emitted while the command runs.
  // Set as `correlation_id` on every related TelemetryEvent.
  string correlation_id = 2;

  // Soft deadline. Agent SHOULD abort and report TIMEOUT past this.
  google.protobuf.Timestamp deadline = 3;

  oneof kind {
    RunInventoryCmd      run_inventory       = 10;
    RunLocalScanCmd      run_local_scan      = 11;
    HashFilesCmd         hash_files          = 12;
    CollectArtifactCmd   collect_artifact    = 13;
    ApplyConfigCmd       apply_config        = 14;
    SelfUpdateCmd        self_update         = 15;
  }
}

message RunInventoryCmd {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_PACKAGES    = 1; // apt / rpm / brew / pip / npm
    KIND_PROCESSES   = 2;
    KIND_USERS       = 3;
    KIND_LISTENERS   = 4;
  }
  repeated Kind kinds = 1;
}

message RunLocalScanCmd {
  // Reference to a signed scanner bundle the agent has already
  // received (or must fetch via collect_artifact). The agent never
  // executes a binary it cannot verify against the bundle signature.
  string bundle_id = 1;

  // Scanner-specific argv tail. The agent's executor enforces an
  // allowlist on argv0 and sandbox profile per scanner kind.
  repeated string argv = 2;

  // Resource caps applied via cgroup v2 + setrlimit / posix_spawn
  // attributes.
  ResourceLimits limits = 3;
}

message ResourceLimits {
  uint64 cpu_quota_us_per_sec   = 1; // 0 = uncapped
  uint64 mem_max_bytes          = 2;
  uint64 pids_max               = 3;
  google.protobuf.Duration wall_timeout = 4;
}

message HashFilesCmd {
  // Absolute paths. Server validates against the agent's policy
  // (allowed directories) before sending. Agent re-validates against
  // its local policy bundle.
  repeated string paths = 1;

  enum Algorithm {
    ALGORITHM_UNSPECIFIED = 0;
    ALGORITHM_SHA256      = 1;
    ALGORITHM_BLAKE3      = 2;
  }
  Algorithm algorithm = 2;
}

message CollectArtifactCmd {
  // The agent uploads bytes back via a series of CommandResult
  // messages with chunked artifact payloads. For files larger than
  // ~10 MB the server is expected to provide an out-of-band upload
  // URL via `apply_config`.
  string path = 1;
  uint64 max_bytes = 2;
}

message ApplyConfigCmd {
  // Replaces the agent's runtime configuration (telemetry filters,
  // upload URLs, log level). Persisted atomically.
  google.protobuf.Struct config = 1;
}

message SelfUpdateCmd {
  string target_version = 1;
  string bundle_url     = 2; // signed update bundle
  bytes  bundle_sig     = 3; // ed25519 signature of bundle_url contents
}

// ---------------------------------------------------------------------------
// Command results (agent → server)
// ---------------------------------------------------------------------------

message CommandResult {
  string idempotency_key = 1;
  string correlation_id  = 2;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK          = 1;
    STATUS_PARTIAL     = 2; // partial success, see error for tail
    STATUS_FAILED      = 3;
    STATUS_TIMEOUT     = 4;
    STATUS_REJECTED    = 5; // agent policy refused the command
    STATUS_UNSUPPORTED = 6; // capability not negotiated
  }
  Status status = 3;

  // When status != OK, structured error.
  string error_code    = 4; // stable code, e.g. "POLICY.PATH_DENIED"
  string error_message = 5;

  // Result payload by command kind. Use Struct to keep schema
  // evolution lightweight.
  google.protobuf.Struct payload = 6;

  // For chunked artifact transfers.
  ArtifactChunk artifact = 7;

  google.protobuf.Duration elapsed = 8;
}

message ArtifactChunk {
  string artifact_id = 1; // server-stable across chunks
  uint32 chunk_index = 2;
  uint32 chunk_total = 3;
  bytes  data        = 4;
  string sha256_hex  = 5; // of the full artifact, present on last chunk
}

// ---------------------------------------------------------------------------
// Policy
// ---------------------------------------------------------------------------

message PolicyUpdate {
  // Monotonic. Agent rejects updates with version <= currently active.
  uint64 version = 1;

  // Signed bundle. Agent verifies signature against backend ed25519
  // public key (pinned at install) BEFORE applying.
  bytes  bundle      = 2;
  bytes  bundle_sig  = 3;

  google.protobuf.Timestamp issued_at = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message PolicyAck {
  uint64 version = 1;
  bool   applied = 2;
  string error   = 3; // populated when applied=false
}

// ---------------------------------------------------------------------------
// Cert rotation
// ---------------------------------------------------------------------------

message RotationRequest {
  // CSR generated by the agent against a fresh keypair. Sent over the
  // existing mTLS-authenticated stream so the server already knows
  // who's asking.
  bytes csr_pem = 1;
  google.protobuf.Timestamp old_cert_not_after = 2;
}

message RotationGrant {
  bytes new_cert_pem = 1;
  bytes chain_pem    = 2; // intermediate(s)
  google.protobuf.Timestamp not_after = 3;
}

// ---------------------------------------------------------------------------
// Disconnect
// ---------------------------------------------------------------------------

message DisconnectNotice {
  // Agent-initiated graceful shutdown (host shutting down, daemon
  // upgrading itself, etc.). Server can mark the agent "offline
  // expected" instead of "lost".
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_SHUTDOWN    = 1;
    REASON_UPGRADING   = 2;
    REASON_RECONFIG    = 3;
  }
  Reason reason = 1;
  string message = 2;
}

message Disconnect {
  // Server-initiated. Agent MUST close the stream and back off per
  // its reconnect policy. For REVOKED / INCOMPATIBLE the agent MUST
  // NOT reconnect with the current credentials.
  enum Reason {
    REASON_UNSPECIFIED   = 0;
    REASON_SERVER_SHUTDOWN = 1; // transient, reconnect normally
    REASON_RATE_LIMIT    = 2;   // back off harder
    REASON_INCOMPATIBLE  = 3;   // protocol_version mismatch
    REASON_REVOKED       = 4;   // cert / agent revoked; do not retry
    REASON_TENANT_DISABLED = 5;
  }
  Reason reason = 1;
  string message = 2;
  google.protobuf.Duration retry_after = 3;
}
