id: web-baseline
name: Web App — passive baseline
description: >-
  OWASP WSTG passive recon + DAST baseline. Maps the public surface of
  a web target, fingerprints stack and TLS posture, and runs Nuclei
  templates safe for production traffic. Active probing is left for
  the follow-up "web-active" playbook.
version: 0.1.0
target_kinds:
  - web
intensity: passive
scanners:
  - nmap
  - nuclei
  - sslyze
  - secure_headers
owasp_refs:
  - WSTG-INFO-02
  - WSTG-INFO-08
  - WSTG-CRYP-01
mitre_refs:
  - T1595
  - T1592
tags:
  - web
  - baseline
  - safe
requires_autonomy_at_least: execute_passive
notes: >-
  Safe to schedule against production assets. No payloads that mutate
  state; SSLYze runs read-only TLS probes.
