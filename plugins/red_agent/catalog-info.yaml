apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: red-agent
  title: Red Agent
  description: Autonomous Red Team plugin for proactive security scanning (recon, DAST, SCA) with sandbox-isolated execution and graph-based vulnerability mapping in FalkorDB.
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/source-location: url:https://baselithcore.xyz
    baselith.ai/plugin-api-url: http://localhost:8000/red-agent
    baselith.ai/health-url: http://localhost:8000/red-agent/settings/scope
    baselith.ai/manifest-url: https://baselithcore.xyz/plugins/red_agent/manifest.yaml
    baselith.ai/category: security
    baselith.ai/license: Proprietary
    app.kubernetes.io/version: '0.1.0'
  labels:
    baselith.ai/readiness: alpha
    baselith.ai/category: security
    app.kubernetes.io/version: '0.1.0'
  links:
    - url: http://localhost:8000/red-agent/ui/
      title: Red Agent Dashboard
      icon: dashboard
    - url: https://baselithcore.xyz/plugins/red-agent
      title: Plugin Documentation
      icon: docs
  tags:
    - security
    - red-team
    - dast
    - sast
    - sca
    - recon
    - vulnerability-management
    - sandbox
    - graph
    - falkordb
    - sarif
    - cybersecurity
spec:
  type: plugin
  lifecycle: alpha
  owner: baselithcore-security
  system: baselithcore
  providesApis:
    - red-agent-scans-api
    - red-agent-graph-api
    - red-agent-reports-api
  dependsOn:
    - component:auth
  consumesApis: []
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: red-agent-scans-api
  description: REST + WebSocket API for managing security scans, findings, and HITL approvals
spec:
  type: openapi
  lifecycle: alpha
  owner: baselithcore-security
  system: baselithcore
  definition: |
    openapi: 3.0.0
    info:
      title: Red Agent Scans API
      version: 0.1.0
    paths:
      /red-agent/scans:
        get:  { summary: List scans }
        post: { summary: Submit scan }
      /red-agent/scans/quick:
        post: { summary: Quick scan (URL only) }
      /red-agent/scans/{id}:
        get:  { summary: Scan detail with findings }
      /red-agent/scans/{id}/approve:
        post: { summary: Approve a HITL-gated scan }
      /red-agent/scans/{id}/reject:
        post: { summary: Reject a HITL-gated scan }
      /red-agent/scans/pending-approvals:
        get:  { summary: List pending HITL approvals }
      /red-agent/guardrails/preflight:
        post: { summary: Validate target without submitting }
      /red-agent/findings:
        get:  { summary: Faceted finding search }
      /red-agent/ws/scans/{id}:
        get:  { summary: WebSocket — live status + finding stream }
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: red-agent-graph-api
  description: Read-only attack-surface graph (Cytoscape-shaped)
spec:
  type: openapi
  lifecycle: alpha
  owner: baselithcore-security
  system: baselithcore
  definition: |
    openapi: 3.0.0
    info:
      title: Red Agent Graph API
      version: 0.1.0
    paths:
      /red-agent/graph/attack-surface:
        get:  { summary: Attack-surface graph for a target }
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: red-agent-reports-api
  description: SARIF 2.1.0 export and report download
spec:
  type: openapi
  lifecycle: alpha
  owner: baselithcore-security
  system: baselithcore
  definition: |
    openapi: 3.0.0
    info:
      title: Red Agent Reports API
      version: 0.1.0
    paths:
      /red-agent/reports/{id}/sarif:
        get:  { summary: Export findings as SARIF 2.1.0 }
