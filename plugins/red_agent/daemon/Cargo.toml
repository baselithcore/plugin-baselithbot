[workspace]
resolver = "2"
members = [
    "crates/daemon",
    "crates/proto",
    "crates/transport",
    "crates/collector",
    "crates/executor",
    "crates/policy",
    "crates/keystore",
]

# The daemon ships as a single static binary; release profile is tuned
# for fleet deployment (small binary, fast cold-start, panic=abort
# avoids unwinding state on a daemon that owns kernel resources).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

[profile.release-debug]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Proprietary"
repository = "https://github.com/baselithcore/plugin-redagent-daemon"
authors = ["BaselithCore Security <security@baselith.io>"]

[workspace.dependencies]
# Async runtime + observability.
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"

# gRPC + TLS.
tonic = { version = "0.12", features = ["tls", "tls-roots", "transport", "gzip"] }
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "0.26"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http2", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
http = "1"

# Crypto.
ed25519-dalek = { version = "2", features = ["pem"] }
x509-parser = "0.16"
sha2 = "0.10"
hex = "0.4"

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost-build = "0.13"

# CLI / config.
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# OS / system probes.
sysinfo = "0.32"
nix = { version = "0.29", features = ["fs", "user", "process"] }

# Sandboxing primitives.
landlock = "0.4"
seccompiler = "0.5"

# Storage (offline buffer).
rusqlite = { version = "0.31", features = ["bundled"] }

# Errors.
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Keystore backends.
zeroize = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
rcgen = { version = "0.13", features = ["pem"] }

# eBPF (linux only — gated in crate Cargo.toml via [target] sections).
aya = "0.13"

# Internal workspace crates (dev path-resolved).
baselith-redagent-proto = { path = "crates/proto" }
baselith-redagent-transport = { path = "crates/transport" }
baselith-redagent-collector = { path = "crates/collector" }
baselith-redagent-executor = { path = "crates/executor" }
baselith-redagent-policy = { path = "crates/policy" }
baselith-redagent-keystore = { path = "crates/keystore" }
