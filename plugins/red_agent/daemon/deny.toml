# cargo-deny configuration for the BaselithCore Red Agent daemon.
#
# Run via:
#   cargo deny check
#
# CI gate: bans, advisories, licenses, and source registries are all
# enforced. Local "warn" entries are conservative defaults that should
# move to "deny" once a clean baseline is established.

[graph]
# Build a dependency graph for the host triple plus the cross-compile
# targets the fleet supports.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "0BSD",
]
copyleft = "deny"
allow-osi-fsf-free = "neither"
default = "deny"
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # OpenSSL is forbidden — daemon uses ring through rustls.
    { name = "openssl" },
    { name = "openssl-sys" },
    # native-tls leaks platform trust stores; daemon needs pinned roots.
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
