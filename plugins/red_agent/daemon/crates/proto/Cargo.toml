[package]
name = "baselith-redagent-proto"
description = "tonic-generated client/server stubs for the AgentChannel RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[features]
# Compile server-side tonic stubs in addition to the client. Off by
# default so the production daemon binary stays client-only; integration
# tests opt in to spin up an in-process AgentChannel server.
server = []

[dependencies]
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
