[package]
name = "baselith-redagent-transport"
description = "mTLS gRPC client for the AgentChannel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
baselith-redagent-proto.workspace = true
tonic.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
http.workspace = true
tower.workspace = true
tower-service.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
hex.workspace = true
anyhow.workspace = true
thiserror.workspace = true
hyper.workspace = true
x509-parser.workspace = true

[dev-dependencies]
rcgen = { version = "0.13", features = ["pem"] }
# Pull in server-side proto stubs only for the integration tests; the
# production daemon binary stays client-only.
baselith-redagent-proto = { path = "../proto", features = ["server"] }
async-stream = "0.3"
prost = { workspace = true }
prost-types = { workspace = true }
tracing-subscriber = { workspace = true }
