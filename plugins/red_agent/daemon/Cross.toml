# cross-rs build configuration.
#
# Each cross target image lacks protoc by default; the pre-build hook
# installs the compiler + the well-known google/protobuf descriptor
# files so `crates/proto/build.rs` can resolve `google/protobuf/*.proto`
# at compile time. Kept minimal to avoid bloating the image cache.

[target.x86_64-unknown-linux-musl]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev",
]

[target.aarch64-unknown-linux-musl]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev",
]

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev",
]
