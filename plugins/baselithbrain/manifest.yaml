name: baselithbrain
version: 0.1.0
description: "BaselithBrain \u2014 a local-first Second Brain (PKM) plugin. Markdown-first\
  \ notes with a block-based TipTap editor, [[wikilink]] backlinks, Zettelkasten +\
  \ LYT graph navigation, and a fast command palette. Mounted as a self-contained\
  \ sub-application with its React/Vite SPA."
author: BaselithCore Team
license: Apache-2.0
category: knowledge
readiness: alpha
# Private per-user vault by default (1 user = 1 tenant). An admin can override
# this to ``shared`` at runtime from the auth console (Plugins → Tenancy).
tenancy: personal
tags:
- pkm
- second-brain
- notes
- zettelkasten
- knowledge-graph
- markdown
- local-first
homepage: https://baselithcore.xyz/plugins/baselithbrain
min_core_version: 1.0.0
required_resources: []
optional_resources:
- qdrant
- redis
python_dependencies:
- fastapi>=0.110.0
- pydantic>=2.5.2
- pydantic-settings>=2.2.0
- pyyaml>=6.0
- python-multipart>=0.0.9
plugin_dependencies: {}
environment_variables:
- BASELITHBRAIN_VAULT_ROOT
- BASELITHBRAIN_SEMANTIC_ENABLED
- BASELITHBRAIN_WATCH_ENABLED
integrity_sha256: 66df852e4f8846b99bf5a9b8c68787a0d88d22ea2a7a435b734c12b460ea87c5
