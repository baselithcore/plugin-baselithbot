name: docheck-mt

# Multi-tenant overlay che riusa lo stack root ``baselithcore-enterprise``
# anziché spinare istanze duplicate di Postgres/Qdrant. Avvia il solo
# engine docheck e lo collega ai servizi root via network esterna
# ``baselithcore-enterprise_default`` (lo crea ``docker compose up``
# nella root del repo).
#
# Prerequisiti runtime:
#
#   # 1. stack root (postgres_db + baselith-core-qdrant) attivo
#   docker compose up -d postgres qdrant
#
#   # 2. DB + user dedicati dentro postgres_db (segregazione logica
#   #    per plugin, stessa istanza condivisa fra tutti i plugin)
#   docker exec postgres_db psql -U baselithcore -d baselithcore \
#     -c "CREATE USER docheck WITH PASSWORD 'docheck-dev';" \
#     -c "CREATE DATABASE docheck OWNER docheck;"
#
#   # 3. avvia overlay docheck
#   docker compose -f plugins/docheck/deploy/docker/compose.postgres.yml up -d

services:
  engine:
    build:
      context: ../docheck-engine
      dockerfile: Dockerfile
    environment:
      DOCHECK_MULTITENANT_ENABLED: "true"
      DOCHECK_DB_BACKEND: "postgres"
      # ``postgres_db`` è risolvibile via la network root condivisa.
      # Collection logica dedicata su Qdrant root: collection naming
      # ``docheck_*`` evita collisioni con altri plugin.
      DOCHECK_POSTGRES_DSN: "postgresql+asyncpg://docheck:docheck-dev@postgres_db:5432/docheck"
      DOCHECK_VECTOR_BACKEND: "qdrant"
      DOCHECK_QDRANT_URL: "http://baselith-core-qdrant:6333"
      DOCHECK_LLM_BASE_URL: "http://host.docker.internal:8000/v1"
      DOCHECK_BIND_TCP: "0.0.0.0:8765"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - engine_data:/data
    networks:
      - baselithcore

# Aggancia il container alla network creata dal root docker-compose
# (``baselithcore-enterprise_default`` o equivalente). ``external: true``
# significa "esiste già — non crearla": qui assumiamo che lo stack root
# sia stato avviato prima.
networks:
  baselithcore:
    name: baselithcore-enterprise_default
    external: true

volumes:
  engine_data:
