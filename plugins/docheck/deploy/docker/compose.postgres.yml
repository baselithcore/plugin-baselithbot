name: docheck-mt

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docheck
      POSTGRES_PASSWORD: docheck-dev
      POSTGRES_DB: docheck
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docheck"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  engine:
    build:
      context: ../docheck-engine
      dockerfile: Dockerfile
    environment:
      DOCHECK_MULTITENANT_ENABLED: "true"
      DOCHECK_DB_BACKEND: "postgres"
      DOCHECK_POSTGRES_DSN: "postgresql+asyncpg://docheck:docheck-dev@postgres/docheck"
      DOCHECK_VECTOR_BACKEND: "qdrant"
      DOCHECK_QDRANT_URL: "http://qdrant:6333"
      DOCHECK_LLM_BASE_URL: "http://host.docker.internal:8000/v1"
      DOCHECK_BIND_TCP: "0.0.0.0:8765"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - engine_data:/data

volumes:
  pg_data:
  qdrant_data:
  engine_data:
