{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-engine-egress-lockdown
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: docheck
      app.kubernetes.io/component: engine
  policyTypes: [Egress, Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: docheck
              app.kubernetes.io/component: ui
      ports:
        - port: 8765
          protocol: TCP
  egress:
    # DNS only inside cluster
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - port: 53
          protocol: UDP
    # vLLM intra-cluster
    {{- if .Values.vllm.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: vllm
      ports:
        - port: 8000
          protocol: TCP
    {{- end }}
    {{- if .Values.multiTenant.enabled }}
    # Postgres
    {{- with .Values.multiTenant.postgres.host }}
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }   # CAVEAT: tighten to actual CIDR in prod
      ports: [{ port: 5432, protocol: TCP }]
    {{- end }}
    # Qdrant
    {{- with .Values.multiTenant.qdrant.host }}
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports: [{ port: {{ $.Values.multiTenant.qdrant.port }}, protocol: TCP }]
    {{- end }}
    {{- end }}
{{- end }}
