apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-engine
  labels:
    app.kubernetes.io/name: docheck
    app.kubernetes.io/component: engine
spec:
  serviceName: {{ .Release.Name }}-engine
  replicas: {{ .Values.engine.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: docheck
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docheck
        app.kubernetes.io/component: engine
    spec:
      containers:
        - name: engine
          image: "{{ .Values.engine.image.repository }}:{{ .Values.engine.image.tag }}"
          imagePullPolicy: {{ .Values.engine.image.pullPolicy }}
          ports:
            - containerPort: 8765
              name: http
          env:
            {{- range $k, $v := .Values.engine.env }}
            - name: {{ $k }}
              value: "{{ $v }}"
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-engine-config
            - secretRef:
                name: {{ .Values.audit.signingKeySecret }}
                optional: true
            {{- if .Values.multiTenant.enabled }}
            - secretRef:
                name: {{ .Release.Name }}-engine-postgres
                optional: true
            {{- with .Values.multiTenant.oidc.clientSecretRef }}
            - secretRef:
                name: {{ . }}
                optional: true
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.engine.persistence.mountPath }}
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.engine.persistence.size }}
        {{- with .Values.global.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-engine
spec:
  selector:
    app.kubernetes.io/name: docheck
    app.kubernetes.io/component: engine
  ports:
    - port: 8765
      targetPort: http
      name: http
