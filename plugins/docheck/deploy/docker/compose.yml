name: docheck

# Single-tenant local stack — Ollama (default LLM) + doCheck engine.
# Switch model with: `docker exec -it docheck-ollama-1 ollama pull <model>`
# and override DOCHECK_LLM_PRIMARY_MODEL.

services:
  ollama:
    image: ollama/ollama:latest
    # GPU optional. Uncomment the deploy block on machines with NVIDIA + nvidia-container-toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama-pull:
    # One-shot: pulls the default models on first boot. Idempotent.
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "OLLAMA_HOST=http://ollama:11434 ollama pull llama3.1:8b &&
       OLLAMA_HOST=http://ollama:11434 ollama pull qwen2.5:3b"
    restart: "no"

  engine:
    build:
      context: ../docheck-engine
      dockerfile: Dockerfile
    environment:
      DOCHECK_LLM_PROVIDER: ollama
      DOCHECK_LLM_BASE_URL: http://ollama:11434/v1
      DOCHECK_LLM_PRIMARY_MODEL: llama3.1:8b
      DOCHECK_LLM_FALLBACK_MODEL: qwen2.5:3b
      DOCHECK_BIND_TCP: 0.0.0.0:8765
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - docheck_data:/data
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped

volumes:
  ollama_models:
  docheck_data:
