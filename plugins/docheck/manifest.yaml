name: docheck
version: 0.1.0
description: "doCheck \u2014 Document Compliance Checker ported from docheck-engine.\
  \ Local-first, glass-box, multi-agent compliance checker for enterprise documents.\
  \ Analyzes PDF/DOCX/XLSX/MD against configurable policy frameworks (GDPR, EU AI\
  \ Act, internal codes) and produces every Finding with verbatim policy excerpt,\
  \ bounding box on the source page, and step-by-step agent reasoning. LangGraph pipeline\
  \ (Classifier \u2192 Structurer \u2192 [Legal | Technical | PII] (parallel) \u2192\
  \ Synthesizer), Ed25519-signed audit chain, on-prem LLM via Ollama/vLLM, embedded\
  \ vector store (Chroma) with optional Qdrant backend, BGE-M3 multilingual embeddings\
  \ (IT + EN native), RBAC with argon2id local auth and OIDC-ready stub. Ships a Next.js\
  \ 15 + React 19 + Electron desktop UI under ui/."
author: GD Services <g.ippolito@gdservices.tech>
homepage: https://github.com/giovanni-ippolito/docheck
license: Proprietary
category: Compliance
readiness: alpha
tags:
- compliance
- gdpr
- eu-ai-act
- glass-box
- rag
- multi-agent
- langgraph
- on-prem
- audit-chain
- ed25519
- electron
integrity_sha256: a9fbe6532a979268557486956b12b606b81942a3e1fc66e876c4e1cf4dd1e82f
