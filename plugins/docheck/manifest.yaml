name: docheck
version: 0.1.0
description: >-
  doCheck — Document Compliance Checker ported from docheck-engine. Local-first,
  glass-box, multi-agent compliance checker for enterprise documents. Analyzes
  PDF/DOCX/XLSX/MD against configurable policy frameworks (GDPR, EU AI Act,
  internal codes) and produces every Finding with verbatim policy excerpt,
  bounding box on the source page, and step-by-step agent reasoning. LangGraph
  pipeline (Classifier → Structurer → [Legal | Technical | PII] (parallel) →
  Synthesizer), Ed25519-signed audit chain, on-prem LLM via Ollama/vLLM,
  embedded vector store (Chroma) with optional Qdrant backend, BGE-M3
  multilingual embeddings (IT + EN native), RBAC with argon2id local auth and
  OIDC-ready stub. Ships a Next.js 15 + React 19 + Electron desktop UI under
  ui/.
author: GD Services <g.ippolito@gdservices.tech>
homepage: https://github.com/giovanni-ippolito/docheck
license: Proprietary
category: Compliance
readiness: alpha

tags:
  - compliance
  - gdpr
  - eu-ai-act
  - glass-box
  - rag
  - multi-agent
  - langgraph
  - on-prem
  - audit-chain
  - ed25519
  - electron

# SHA-256 over the plugin's *.py/*.pyi tree (recomputed each release).
# Generate locally with:
#   python -c "from pathlib import Path; \
#     from core.plugins.integrity import compute_plugin_hash; \
#     print(compute_plugin_hash(Path('plugins/docheck')))"
integrity_sha256: 72efc71ee5f78287673c7c5353f1260dad44855f1b3b67b4a1197c018c35421f

# Optional baselithcore plugin dependencies. DoCheck is self-contained:
# all integrations (alembic, agents, services, vectorstores, ui) live inside
# the plugin tree.
plugin_dependencies: {}

# Core baselithcore deps already covered by the host pyproject:
# fastapi, uvicorn, pydantic, httpx, structlog, opentelemetry-sdk, sqlalchemy,
# alembic. The list below is the docheck-specific surface (mirrors
# docheck-engine/pyproject.toml dependencies block).
python_dependencies:
  - "pydantic[email]>=2.9"
  - "pydantic-settings>=2.5"
  # SQLAlchemy async drivers (NOT in docheck-engine pyproject — installed
  # transitively via langchain ecosystem; pinned here for plugin isolation).
  - "aiosqlite>=0.20"
  - "asyncpg>=0.30"          # required when DOCHECK_DB_BACKEND=postgres
  # Crypto + auth
  - "argon2-cffi>=23.1"
  - "cryptography>=43"
  - "pynacl>=1.5"
  - "python-jose[cryptography]>=3.3"
  - "python-multipart>=0.0.12"
  - "aiofiles>=24.1"
  # Agentic / RAG
  - "langgraph>=0.2"
  - "langchain>=0.3"
  - "langchain-community>=0.3"
  - "llama-index>=0.12"
  - "chromadb>=0.5"
  - "qdrant-client>=1.12"
  - "FlagEmbedding>=1.3"
  # Document parsing + OCR
  - "pdfplumber>=0.11"
  - "python-docx>=1.1"
  - "openpyxl>=3.1"
  - "markdown-it-py>=3.0"
  - "paddlepaddle>=2.6"
  - "paddleocr>=2.8"
  - "pdf2image>=1.17"
  - "numpy>=1.26"
  # LLM client (OpenAI-compatible — works against Ollama/vLLM/llama.cpp)
  - "openai>=1.50"
  # Language detection
  - "lingua-language-detector>=2.0"
  # OS keychain for master key custody (audit signing key, DB key)
  - "keyring>=24.0"

# DoCheck exposes a knob-heavy env surface (Pydantic-settings, prefix
# DOCHECK_*). Documented in docs/MVP_STATUS.md and docs/blueprint/. Only the
# load-bearing keys are surfaced here for UI/CLI use.
environment_variables:
  - name: DOCHECK_DEBUG
    description: Enable debug logging + uvicorn reload.
    required: false
  - name: DOCHECK_STORAGE_ROOT
    description: Root for SQLite DB, document blobs, Chroma persistence, audit key.
    required: false
  - name: DOCHECK_SOCKET_PATH
    description: Unix-domain socket path (default deployment — no TCP exposure).
    required: false
  - name: DOCHECK_BIND_TCP
    description: Optional "host:port" override (e.g. 127.0.0.1:8765) for non-socket deploys.
    required: false
  - name: DOCHECK_LLM_PROVIDER
    description: LLM provider — `ollama` (default), `vllm`, or `openai-compatible`.
    required: false
  - name: DOCHECK_LLM_BASE_URL
    description: OpenAI-compatible base URL (default http://127.0.0.1:11434/v1 for Ollama).
    required: false
  - name: DOCHECK_LLM_PRIMARY_MODEL
    description: Primary model id (default llama3.1:8b).
    required: false
  - name: DOCHECK_LLM_FALLBACK_MODEL
    description: Fallback model id (default qwen2.5:3b).
    required: false
  - name: DOCHECK_EMBEDDING_MODEL
    description: Embedding model (default BAAI/bge-m3, multilingual IT+EN).
    required: false
  - name: DOCHECK_VECTOR_BACKEND
    description: Vector store — `chroma` (default, embedded) or `qdrant` (post-MVP).
    required: false
  - name: DOCHECK_CHROMA_PERSIST_DIR
    description: ChromaDB persistence directory.
    required: false
  - name: DOCHECK_QDRANT_URL
    description: Qdrant HTTP endpoint (when DOCHECK_VECTOR_BACKEND=qdrant).
    required: false
  - name: DOCHECK_DB_BACKEND
    description: Database backend — `sqlite` (default) or `postgres` (multi-tenant).
    required: false
  - name: DOCHECK_POSTGRES_DSN
    description: PostgreSQL DSN (postgresql+asyncpg://user:pw@host/db) — required when DB_BACKEND=postgres.
    required: false
  - name: DOCHECK_DB_ENCRYPTION_ENABLED
    description: Enable SQLCipher (requires `pip install '.[encryption]'` extras and OS sqlcipher libs).
    required: false
  - name: DOCHECK_DB_KEY_KEYRING_SERVICE
    description: OS keychain service name for the SQLCipher master key.
    required: false
  - name: DOCHECK_AUDIT_SIGNING_KEY_PATH
    description: Path to Ed25519 audit signing key (auto-generated on first boot).
    required: false
  - name: DOCHECK_MULTITENANT_ENABLED
    description: Enable multi-tenant mode (requires Postgres + RLS migrations).
    required: false
  - name: DOCHECK_OIDC_ISSUER
    description: OIDC issuer URL (activates Keycloak/OIDC auth path when set).
    required: false
  - name: DOCHECK_RETENTION_DEFAULT_DAYS
    description: Default document retention window (default 365).
    required: false
  - name: DOCHECK_BUILTIN_DISABLED_RULES
    description: Comma-separated builtin rule ids to disable (e.g. FORMAT-DATE-ISO,ID-CF-CHECKSUM).
    required: false
  - name: DOCHECK_BUILTIN_SEVERITY_OVERRIDES
    description: Builtin severity overrides (format RULE_ID=FAIL,RULE_ID2=WARN).
    required: false
