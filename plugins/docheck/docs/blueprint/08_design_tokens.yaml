# doCheck Design Tokens
# Mappati 1:1 a Tailwind CSS + shadcn/ui theme

version: "0.1.0"
mode: dark   # default enterprise

color:
  bg:
    canvas:        "#09090B"   # main background
    panel:         "#18181B"   # panel surface
    panel_elev:    "#1F1F23"   # elevated surface (cards, popovers)
  border:
    default:       "#27272A"
    strong:        "#3F3F46"
  text:
    primary:       "#FAFAFA"
    secondary:     "#A1A1AA"
    muted:         "#71717A"
  status:
    success:       "#10B981"   # emerald — Conforme
    warning:       "#F59E0B"   # amber — Da verificare
    danger:        "#EF4444"   # red — Violazione
    info:          "#3B82F6"   # blue — Citazione/Info
  highlight:
    danger:        "rgba(239,68,68,0.15)"
    warning:       "rgba(245,158,11,0.18)"
    info:          "rgba(59,130,246,0.15)"
    success:       "rgba(16,185,129,0.15)"
  focus:
    ring:          "#3B82F6"

radius:
  sm:   "6px"
  md:   "8px"
  lg:   "12px"
  xl:   "16px"
  pill: "9999px"

spacing:    # px scale
  "0":  "0"
  "1":  "2px"
  "2":  "4px"
  "3":  "6px"
  "4":  "8px"
  "5":  "12px"
  "6":  "16px"
  "7":  "20px"
  "8":  "24px"
  "9":  "32px"
  "10": "40px"
  "11": "56px"
  "12": "80px"

font:
  family:
    sans: "Inter, system-ui, -apple-system, sans-serif"
    mono: "JetBrains Mono, ui-monospace, monospace"
  size:
    xs:   "12px"
    sm:   "13px"
    base: "14px"
    md:   "15px"
    lg:   "16px"
    xl:   "18px"
    "2xl": "20px"
    "3xl": "24px"
    "4xl": "30px"
  weight:
    regular:  400
    medium:   500
    semibold: 600
    bold:     700
  line_height:
    tight:   1.25
    normal:  1.5
    relaxed: 1.65

shadow:
  panel:   "0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.45)"
  popover: "0 12px 32px rgba(0,0,0,0.55)"
  focus:   "0 0 0 2px #3B82F6"

motion:
  duration:
    fast: "120ms"
    base: "200ms"
    slow: "320ms"
  easing:
    out:   "cubic-bezier(.2,.8,.2,1)"
    in:    "cubic-bezier(.6,0,.4,0)"
    inout: "cubic-bezier(.4,0,.2,1)"

z_index:
  base:     0
  dropdown: 100
  sticky:   200
  modal:    300
  popover:  400
  toast:    500

# Componenti shadcn/ui mapping
components:
  button:
    height:
      sm: "28px"
      md: "32px"
      lg: "40px"
    padding_x:
      sm: "12px"
      md: "16px"
      lg: "20px"
  badge:
    height: "22px"
    padding_x: "8px"
    font_size: "12px"
    radius: "pill"
  card:
    padding: "16px"
    radius: "lg"
    border: "1px solid var(--border-default)"
  input:
    height: "36px"
    radius: "md"
    padding_x: "12px"

# Severity component variants
severity:
  fail:
    bg:        "var(--status-danger)"
    bg_soft:   "var(--highlight-danger)"
    text:      "#FFFFFF"
    border:    "var(--status-danger)"
    icon:      "XCircle"
  warn:
    bg:        "var(--status-warning)"
    bg_soft:   "var(--highlight-warning)"
    text:      "#0A0A0A"
    border:    "var(--status-warning)"
    icon:      "AlertTriangle"
  pass:
    bg:        "var(--status-success)"
    bg_soft:   "var(--highlight-success)"
    text:      "#FFFFFF"
    border:    "var(--status-success)"
    icon:      "CheckCircle2"
  info:
    bg:        "var(--status-info)"
    bg_soft:   "var(--highlight-info)"
    text:      "#FFFFFF"
    border:    "var(--status-info)"
    icon:      "Info"
