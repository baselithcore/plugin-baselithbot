packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@nestjs/core': set this to true or false
  '@swc/core': set this to true or false
  argon2: true
  better-sqlite3: set this to true or false
  esbuild: set this to true or false
  oracledb: set this to true or false
  protobufjs: true
ignoredBuiltDependencies:
  - '@swc/core'
  - oracledb
  - protobufjs
onlyBuiltDependencies:
  - '@nestjs/core'
  - better-sqlite3
  - esbuild
