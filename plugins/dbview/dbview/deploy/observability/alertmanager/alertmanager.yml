---
# Alertmanager — minimal default. Configure receivers (Slack/email) via env vars
# and customize the route tree before shipping to prod.

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Add slack_configs / email_configs here. Left empty so alertmanager
    # boots clean in dev/local stacks; configure before going to prod.

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'route']
