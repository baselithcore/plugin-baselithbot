- {url: 'https://www.theverge.com/rss/index.xml', source: 'The Verge', category: tech, lang: en}
- {url: 'https://www.wired.com/feed/rss', source: 'Wired', category: tech, lang: en}
# ── Cybersecurity ─────────────────────────────────────────────────────────
- {url: 'https://feeds.feedburner.com/TheHackersNews', source: 'The Hacker News', category: cyber, lang: en}
