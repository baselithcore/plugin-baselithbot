---
# IT Support / Corporate IT helpdesk vertical pack — seed example.
# Validates against `llm_wiki.domain.pack.DomainPack`.

schema_version: 1

name: it_support
label: "Wiki Assistenza IT"
description: "Knowledge base IT aziendale: runbook helpdesk, procedure di supporto endpoint, gestione account e accessi, MDM, asset, policy di sicurezza, troubleshooting hardware/software, ticket e SLA."
language: it
seed: true

page_types:
  - id: source
    label: "Fonte"
    plural: "fonti"
    folder: sources
    prompt_template: source_page.j2
  - id: concept
    label: "Concetto / Procedura"
    plural: "concetti"
    folder: concepts
    prompt_template: entity_page.j2
  - id: entity
    label: "Asset / Sistema"
    plural: "asset"
    folder: entities
    prompt_template: entity_page.j2
  - id: topic
    label: "Tema"
    plural: "temi"
    folder: topics
    prompt_template: entity_page.j2

# Sub-classifications IT-support specifiche.
subtypes:
  source:
    - runbook
    - procedura-helpdesk
    - knowledge-article
    - faq
    - policy-sicurezza
    - policy-it
    - sla-ola
    - manuale-fornitore
    - kb-vendor
    - postmortem
    - bollettino-sicurezza
    - article
    - paper
    - note
  concept:
    - procedura-operativa
    - troubleshooting-step
    - policy
    - controllo-sicurezza
    - principio
  entity:
    - sistema-software
    - servizio-cloud
    - dispositivo-endpoint
    - rete
    - account-identity
    - fornitore
    - team-it

frontmatter_schema: schema.yaml

grouping: []

ui:
  app_name: "Wiki Assistenza IT"
  short_name: "IT Support"
  vault_label: "Vault IT"
  tagline: "Runbook helpdesk e procedure IT, grounded sulla knowledge base aziendale."
  empty_state: "Carica runbook, procedure, policy IT o knowledge article del vendor per iniziare."
  hero_question: "Cosa vuoi sapere"
  hero_highlight: "sull'IT aziendale?"
  hero_pill: "Assistente IT · grounded su runbook e policy"
  hero_pill_icon: "Wrench"
  disclaimer: "Le risposte ricostruiscono procedure operative presenti nel vault e non sostituiscono la verifica diretta sull'ambiente target. Conferma sempre versione del software, stato del dispositivo, identità del richiedente e privilegi richiesti prima di eseguire procedure di reset, revoca accessi, modifiche di configurazione o azioni su asset condivisi."
  suggested_questions:
    - category: "account"
      label: "Reset password"
      hint: "Procedura + verifica identità"
      icon: "KeyRound"
      prompt: "Qual è la procedura ufficiale di reset password per un dipendente che non riesce ad accedere al portale aziendale: verifica identità, canale di reset, MFA, comunicazione delle credenziali e log dell'operazione?"
    - category: "onboarding"
      label: "Provisioning nuovo dispositivo"
      hint: "Setup endpoint day-1"
      icon: "Laptop"
      prompt: "Come si esegue il provisioning di un nuovo notebook aziendale per un dipendente: enrollment MDM, profili applicati, software baseline, account, cifratura disco, consegna e verifiche finali?"
    - category: "incidenti"
      label: "Sospetto phishing"
      hint: "Triage + escalation"
      icon: "ShieldAlert"
      prompt: "Un utente segnala una mail sospetta: qual è la procedura di triage helpdesk, criteri per dichiarare phishing confermato, escalation al SOC e azioni di contenimento (blocco mittente, hash allegati, reset credenziali se cliccato)?"
    - category: "rete"
      label: "VPN non si connette"
      hint: "Troubleshooting passo-passo"
      icon: "Network"
      prompt: "Un utente non riesce a connettersi alla VPN aziendale: qual è il troubleshooting passo-passo (client, certificato, MFA, route, firewall locale) e quando escalare al network team?"
    - category: "accessi"
      label: "Richiesta accesso applicazione"
      hint: "Approvazione + provisioning"
      icon: "UserCheck"
      prompt: "Come si processa una richiesta di accesso a un'applicazione aziendale: ticket, approvazione del manager, verifica del ruolo, provisioning sull'IdP, comunicazione all'utente e revisione periodica?"
    - category: "offboarding"
      label: "Cessazione dipendente"
      hint: "Revoca accessi + ritiro asset"
      icon: "UserMinus"
      prompt: "Qual è la procedura IT di offboarding alla cessazione di un dipendente: revoca account/SSO, disattivazione MFA, ritiro endpoint, wipe MDM, recupero asset, archiviazione mailbox e termini SLA?"
  page_type_labels:
    source: "Fonti"
    concept: "Concetti / Procedure"
    entity: "Asset / Sistemi"
    topic: "Temi"
  extra:
    badges:
      stato: ["vigente", "in-revisione", "deprecato", "ritirato"]
      severity:
        - sev1
        - sev2
        - sev3
        - sev4
      ambito:
        - runbook-helpdesk
        - policy-aziendale
        - procedura-vendor
        - controllo-sicurezza
        - troubleshooting
        - knowledge-base

prompts_dir: prompts
examples_dir: examples
