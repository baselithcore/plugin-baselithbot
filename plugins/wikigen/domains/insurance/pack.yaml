---
# Insurance vertical pack — port of the rag-wiki MVP into a Domain Pack.
# Validates against `llm_wiki.domain.pack.DomainPack`.

schema_version: 1

name: insurance
label: "Wiki Polizze Assicurative"
description: "Knowledge base contrattuale: Set Informativi, NTA, DIP, regolamenti IVASS, sentenze."
language: it
seed: true

page_types:
  - id: source
    label: "Fonte"
    plural: "fonti"
    folder: sources
    prompt_template: source_page.j2
  - id: concept
    label: "Concetto / Garanzia"
    plural: "concetti"
    folder: concepts
    prompt_template: entity_page.j2
  - id: entity
    label: "Entità"
    plural: "entità"
    folder: entities
    prompt_template: entity_page.j2
  - id: topic
    label: "Tema"
    plural: "temi"
    folder: topics
    prompt_template: entity_page.j2

# Insurance-specific sub-classifications. Used by ingest planner JSON-Schema
# enums and by the parser to validate frontmatter `subtype`.
subtypes:
  source:
    - polizza-set-informativo
    - norme-assuntive
    - sentenza
    - regolamento-ivass
    - circolare-ivass
    - dip
    - dip-aggiuntivo
    - article
    - paper
    - note
  concept:
    - garanzia-assicurativa
    - pack-opzionale
    - prodotto-assicurativo
    - clausola
    - normativa
    - principio
  entity:
    - compagnia
    - regolatore
    - gestore
    - professionista

frontmatter_schema: schema.yaml

# Replaces the hardcoded `/api/editions` endpoint of the reference project:
# served by the generic `/api/groups?rule=editions` (Step 3).
grouping:
  - key: editions
    label: "Edizioni Prodotto"
    page_type: source
    group_by:
      - codice-prodotto
      - edizione-iso
    label_from: "{title}"
    sort_by:
      - edizione-iso
    extra_fields:
      - modello
      - stato
      - edizione

ui:
  app_name: "Unipol RAG"
  short_name: "Polizze"
  vault_label: "Vault contrattuale"
  tagline: "chat sul vault"
  empty_state: "Risposte ancorate a Condizioni di Assicurazione, Norme Tecniche Assuntive, Codice Civile e regolamenti IVASS. Ogni claim cita articolo e pagina con verbatim."
  hero_question: "Cosa vuoi sapere"
  hero_highlight: "sulla polizza?"
  hero_pill: "Assistente Polizza · grounded su fonti"
  hero_pill_icon: "Scale"
  disclaimer: "Le risposte non sostituiscono il parere di un agente o di un legale. Per emissione contrattuale e liquidazione sinistri, verifica sempre il testo esatto di Polizza dell'Assicurato e l'edizione applicabile."
  suggested_questions:
    - category: "copertura"
      label: "Terremoto è coperto?"
      hint: "Sezione Eventi Catastrofali"
      icon: "Building2"
      prompt: "Il terremoto è coperto dalla Unipol Casa&Servizi? Quali propedeuticità servono per attivare la garanzia Eventi Catastrofali e con quali limiti/carenze?"
    - category: "esclusioni"
      label: "Pack Protezione Digitale"
      hint: "Cosa NON copre"
      icon: "ShieldCheck"
      prompt: "Elenca precisamente cosa NON copre il Pack Protezione Digitale della Unipol Casa&Servizi, con articolo CdA per ogni esclusione."
    - category: "sinistri"
      label: "Furto in casa: denuncia"
      hint: "Procedura passo-passo + termini"
      icon: "ClipboardList"
      prompt: "Ho avuto un furto in abitazione. Qual è la procedura completa per la denuncia del sinistro, con termini (CC + CdA) e obblighi a carico dell'Assicurato?"
    - category: "calcoli"
      label: "Franchigia vs Scoperto"
      hint: "Esempio numerico"
      icon: "Wallet"
      prompt: "Spiegami la differenza tra franchigia e scoperto con un esempio di calcolo concreto: scoperto 10% minimo € 1.000 su un danno di € 4.000 e di € 15.000."
    - category: "confronti"
      label: "Valore intero vs Primo rischio"
      hint: "Confronto forme assicurative"
      icon: "FileSearch"
      prompt: "Che differenza operativa c'è tra forma a valore intero (con regola proporzionale art. 1907 CC) e primo rischio assoluto? Quale conviene in quali casi?"
    - category: "normativa"
      label: "Termine denuncia sinistro"
      hint: "CC art. 1913 + deroghe CdA"
      icon: "Gavel"
      prompt: "Qual è il termine legale per la denuncia del sinistro (art. 1913 CC)? La Unipol Casa&Servizi deroga in senso favorevole all'Assicurato? Cita articolo CdA."
  page_type_labels:
    source: "Fonti"
    concept: "Concetti / Garanzie"
    entity: "Entità"
    topic: "Temi"
  extra:
    badges:
      stato: ["vigente", "superata", "abrogata"]
      rango:
        - regolamento-ue
        - cc-inderogabile
        - cc-derogabile
        - cap
        - regolamento-ivass
        - circolare-ivass
        - condizioni-contrattuali
        - nta
        - accordo-accessorio
        - giurisprudenza

prompts_dir: prompts
examples_dir: examples

# Knowledge graph (graphify-inspired) per assicurazioni.
graph:
  entity_types:
    - id: concept
      label: "Concetto / Garanzia"
      description: "Garanzie, pack opzionali, clausole, principi contrattuali."
      examples:
        - "RCT"
        - "incendio fabbricato"
        - "pack opzionale Casa Domotica"
        - "regola proporzionale"
    - id: entity
      label: "Entità"
      description: "Compagnie, regolatori (IVASS), professionisti, gestori."
      examples:
        - "Unipol Assicurazioni"
        - "IVASS"
        - "Generali Italia"
    - id: source
      label: "Fonte"
      description: "Documenti contrattuali e normativi citabili."
      examples:
        - "Set Informativo Unipol Casa&Servizi"
        - "Regolamento IVASS 41/2018"
        - "Cass. Civ. III 12345/2024"
    - id: topic
      label: "Tema"
      description: "Aree tematiche trasversali (sinistro, premio, recesso)."
      examples: ["denuncia sinistro", "calcolo premio", "recesso"]
  relation_types:
    - id: COVERS
      label: "copre"
      description: "Una polizza/garanzia copre un rischio o evento."
    - id: EXCLUDES
      label: "esclude"
      description: "Una polizza/garanzia esclude un caso."
    - id: DERIVES_FROM
      label: "deriva da"
      description: "Norma o clausola che deriva da una fonte superiore."
    - id: REGULATED_BY
      label: "regolato da"
      description: "Materia regolata da una norma/regolamento."
    - id: PART_OF
      label: "fa parte di"
      description: "Garanzia parte di un pack / prodotto."
    - id: ISSUED_BY
      label: "emesso da"
      description: "Prodotto/documento emesso da una compagnia o ente."
    - id: RELATES_TO
      label: "è correlato a"
  extraction_hints: |
    Identifica garanzie e pack opzionali come `concept`; compagnie ed enti
    regolatori (IVASS, ANIA) come `entity`; polizze, NTA, DIP, sentenze,
    regolamenti IVASS come `source`. Usa `COVERS`/`EXCLUDES` per il
    rapporto garanzia↔rischio; `DERIVES_FROM` per la gerarchia normativa
    (CC > CAP > regolamenti IVASS > CdA); `ISSUED_BY` per legare prodotti
    a compagnie; `REGULATED_BY` per legare materie a fonti normative.
