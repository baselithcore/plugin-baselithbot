---
# Frontmatter schema for the insurance pack. Loaded by Step 3
# `FrontmatterSchema`. Mirrors the implicit fields used by the rag-wiki MVP.

fields:
  # universal
  - name: title
    type: string
    required: true
  - name: type
    type: string
    required: true
    enum: [source, concept, entity, topic]
    description: "Page kind. Aligns with pack.page_types[*].id."
  - name: subtype
    type: string
    required: false
  - name: tags
    type: array
    required: false
  - name: aliases
    type: array
    required: false
  - name: created
    type: date
    required: false
  - name: updated
    type: date
    required: false
  - name: sources
    type: integer
    required: false

  # registro autoritativo (anti-hallucination — vedi _template/schema.yaml)
  - name: doc_register
    type: string
    required: false
    enum: [operational, conceptual, mixed]

  # source-specific
  - name: source_file
    type: string
    page_types: [source]
  - name: source_type
    type: string
    page_types: [source]
    enum:
      - polizza-set-informativo
      - norme-assuntive
      - sentenza
      - regolamento-ivass
      - circolare-ivass
      - dip
      - dip-aggiuntivo
      - article
      - paper
      - note
  - name: author
    type: string
    page_types: [source]
  - name: date
    type: date
    page_types: [source]
  - name: ingested
    type: date
    page_types: [source]
  - name: source_hash
    type: string
    page_types: [source]
  - name: edizione
    type: string
    page_types: [source]
  - name: edizione-iso
    type: date
    page_types: [source]
  - name: decorrenza
    type: date
    page_types: [source]
  - name: sostituisce
    type: string
    page_types: [source]
  - name: sostituita-da
    type: string
    page_types: [source]
  - name: stato
    type: string
    page_types: [source]
    enum: [vigente, superata, abrogata]
  - name: modello
    type: string
    page_types: [source]
  - name: codice-ramo
    type: integer
    page_types: [source]
  - name: codice-prodotto
    type: string
    page_types: [source, concept]
  - name: rango
    type: string
    page_types: [source]
    enum:
      - regolamento-ue
      - cc-inderogabile
      - cc-derogabile
      - cap
      - regolamento-ivass
      - circolare-ivass
      - condizioni-contrattuali
      - nta
      - accordo-accessorio
      - giurisprudenza
  - name: riservatezza
    type: string
    page_types: [source]
    enum: [alta, media, bassa]

  # concept (garanzia / pack) specific
  - name: prodotto
    type: string
    page_types: [concept]
  - name: sezione
    type: string
    page_types: [concept]
  - name: richiede-sezioni
    type: array
    page_types: [concept]
  - name: richiede-logica
    type: string
    page_types: [concept]
    enum: [any_of, all_of, none]
  - name: acquistabile-senza-base
    type: boolean
    page_types: [concept]
  - name: vincoli-note
    type: string
    page_types: [concept]

extra: {}
