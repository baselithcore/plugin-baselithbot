schema_version: 1
name: technical_custom
label: BaselithWiki
description: White-label LLM wiki for the technical_custom domain.
language: it
seed: false
page_types:
- id: source
  label: Fonte
  plural: fonti
  folder: sources
  prompt_template: source_page.j2
- id: concept
  label: Concetto
  plural: concetti
  folder: concepts
  prompt_template: entity_page.j2
- id: entity
  label: Entità
  plural: entità
  folder: entities
  prompt_template: entity_page.j2
- id: topic
  label: Tema
  plural: temi
  folder: topics
  prompt_template: entity_page.j2
subtypes: {}
frontmatter_schema: schema.yaml
grouping: []
ui:
  logo_path: assets/logo-white.png
  theme:
    primary: '#1d4f91'
    primary_hover: '#163a6c'
    accent: '#1f8a8a'
  app_name: BaselithWiki
  short_name: Custom
  vault_label: Vault
  tagline: Drop sources, query a living wiki.
  empty_state: Carica la prima fonte per iniziare.
  disclaimer: Il sistema può commettere degli errori. Verifica sempre i dati critici prima dell'uso.
  page_type_labels:
    source: Fonti
    concept: Concetti
    entity: Entità
    topic: Temi
  suggested_questions:
  - category: definizione
    label: Cos'è l'AI agentica?
    hint: Comprendi questo concetto avanzato
    icon: Lightbulb
    prompt: Qual è il significato e l'importanza dell'AI agentica nelle organizzazioni?
  - category: procedura
    label: Fasi di implementazione di Claude
    hint: Guida passo passo per l'implementazione
    icon: ClipboardList
    prompt: Quali sono le fasi principali per implementare Claude Cowork in un'azienda?
  - category: confronto
    label: Confronta Claude e agenti AI
    hint: Scopri le differenze tra i due
    icon: FileSearch
    prompt: Quali sono le differenze chiave tra Claude e le soluzioni AI più semplici come i chatbot?
  - category: panoramica
    label: Strategia di trasformazione AI
    hint: Vista generale sulle strategie
    icon: BookOpen
    prompt: Da dove inizio se voglio capire come integrare l'AI nei processi aziendali?
  - category: esempio
    label: Esempi di implementazione
    hint: Guarda come altre aziende agiscono
    icon: Sparkles
    prompt: Puoi fornirmi esempi concreti di come le aziende hanno implementato Claude con successo?
prompts_dir: prompts
examples_dir: examples
