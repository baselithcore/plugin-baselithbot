# nginx — LLM Wiki production server block.
# Include questo da /etc/nginx/sites-available/llm-wiki, symlink a sites-enabled.
# Termina TLS qui (gestisci cert con certbot/acme.sh).

# Map per riconoscere asset hashati Vite (*-<hash>.<ext>) -> immutable cache
map $request_uri $immutable_asset {
    default 0;
    "~*\.([0-9a-f]{8,})\.(js|css|woff2?|svg|png|jpg|webp|avif|ico)(\?.*)?$" 1;
}

# Upstream uvicorn
upstream llm_wiki_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name wiki.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wiki.example.com;

    # TLS (esempi certbot)
    ssl_certificate /etc/letsencrypt/live/wiki.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.example.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Body size: ingest carica PDF
    client_max_body_size 100M;
    client_body_timeout 5m;

    # Security headers (app già setta CSP/X-Frame; defense-in-depth qui)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ----- Block admin from public (loopback-only enforced app-side) -----
    location ^~ /api/admin {
        return 404;
    }

    # ----- Static SPA root -----
    root /srv/llm-wiki/app/frontend/dist;
    index index.html;

    # Hashed assets: long cache + immutable
    location ~* \.([0-9a-f]{8,})\.(js|css|woff2?|svg|png|jpg|webp|avif|ico)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html: no cache (force re-fetch dopo deploy)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # ----- API + auth + health -> uvicorn -----
    location ~ ^/(api|auth|health|healthz) {
        proxy_pass http://llm_wiki_app;

        # Streaming-friendly: NDJSON + SSE
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_set_header Connection "";

        # Timeouts lunghi per LLM streaming
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;

        # Forwarded headers (uvicorn --proxy-headers --forwarded-allow-ips *)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SPA fallback (tutto il resto -> index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
