---
groups:
  - name: llm-wiki-slo
    interval: 30s
    rules:
      - alert: ChatLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, route) (
              rate(wiki_chat_request_latency_seconds_bucket[5m])
            )
          ) > 5
        for: 10m
        labels:
          severity: warning
          slo: chat_latency
        annotations:
          summary: "Chat P95 > 5s su {{ $labels.route }}"
          description: "SLO violato: latenza P95 chat = {{ $value | humanizeDuration }}"

      - alert: HighErrorRate
        expr: |
          sum by (route) (rate(wiki_chat_request_errors_total[5m]))
            / sum by (route) (rate(wiki_chat_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Error rate > 5% su {{ $labels.route }}"
          description: "Rate errori = {{ $value | humanizePercentage }}"

      - alert: IngestFailureSpike
        expr: |
          sum by (stage) (rate(wiki_ingest_failures_total[10m])) > 0.05
        for: 15m
        labels:
          severity: warning
          slo: ingest
        annotations:
          summary: "Ingest pipeline fallisce alla fase {{ $labels.stage }}"
          description: "Fallimenti per secondo = {{ $value | humanize }}"

      - alert: LLMProviderDown
        expr: wiki_llm_provider_up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "LLM provider non raggiungibile"
          description: "Healthcheck Ollama/OpenAI fallisce da > 3 min"

  - name: llm-wiki-infra
    interval: 30s
    rules:
      - alert: ContainerDown
        expr: up{job="llm-wiki"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "llm-wiki backend non raggiungibile"

      - alert: HostDiskAlmostFull
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk / sotto 15% libero su {{ $labels.instance }}"

      - alert: HostMemoryHigh
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
            / node_memory_MemTotal_bytes > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RAM host > 90% su {{ $labels.instance }}"

      - alert: PostgresDown
        expr: wiki_postgres_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres non raggiungibile dall'app"

      - alert: QdrantDown
        expr: wiki_qdrant_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Qdrant non raggiungibile / collection mancante"
