[alembic]
script_location = alembic

# URL effettiva costruita da `alembic/env.py` leggendo `DATABASE_URL` (o
# i pezzi POSTGRES_*) — qui resta vuota apposta. ConfigParser tratterebbe
# `%` come interpolazione, e password URL-encoded romperebbero il parsing.
sqlalchemy.url =

# Non ricreare automaticamente la cartella versions su upgrade/downgrade.
# Le revisioni vivono sotto controllo versione.
file_template = %%(rev)s_%%(slug)s

# Timezone usato negli script generati. UTC per default — coerente con
# pattern agent-jira (TIMESTAMPTZ ovunque).
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
