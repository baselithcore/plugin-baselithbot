apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cve-hunter
  title: Cve Hunter
  description: Autonomous AI agent swarm for CVE scanning, vulnerability discovery, and NVD correlation.
  labels:
    baselith.ai/readiness: stable
    baselith.ai/category: security
    baselith.ai/pattern-swarm: "true"
    baselith.ai/pattern-reasoning: "true"
    app.kubernetes.io/version: 1.0.0
  annotations:
    backstage.io/techdocs-ref: dir:.
    baselith.ai/health-url: http://localhost:8000/health
    baselith.ai/plugin-api-url: http://localhost:8000/api/plugins/cve_hunter
    baselith.ai/manifest-url: url:https://github.com/baselith/core/blob/main/plugins/cve_hunter/manifest.yaml
    backstage.io/source-location: url:https://github.com/baselith/baselith-sec
    baselith.ai/license: Proprietary
  tags:
    - security
    - cve
    - vulnerability
    - scanner
    - swarm
  links:
    - url: http://localhost:8000/api/plugins/cve_hunter
      title: Plugin API
      icon: dashboard
    - url: https://docs.baselith.internal/plugins/cve_hunter
      title: Documentation
      icon: docs
    - url: https://github.com/baselith/baselith-sec
      title: Homepage
      icon: web
spec:
  type: baselith-plugin
  lifecycle: production
  owner: baselith-core-team
  system: baselith-core
  providesApis:
    - cve-hunter-api
  dependsOn: []
