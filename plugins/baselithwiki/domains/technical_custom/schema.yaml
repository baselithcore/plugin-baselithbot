---
# Frontmatter schema for the `_template` pack.
#
# Consumed by `llm_wiki.domain.schema.FrontmatterSchema`. Keys declared
# here are the only ones projected into the Qdrant payload by
# `WikiPage.to_payload`. Anything written into a page's frontmatter that
# is NOT declared here is silently dropped — so retrieval-time signals
# (e.g. `doc_register`) must be listed below or they vanish before
# reaching the RAG agent.

fields:
  # --- universal ---------------------------------------------------------
  - name: title
    type: string
    required: true
  - name: type
    type: string
    required: true
    enum: [source, concept, entity, topic]
    description: "Page kind. Aligns with pack.page_types[*].id."
  - name: subtype
    type: string
    required: false
  - name: tags
    type: array
    required: false
  - name: aliases
    type: array
    required: false
  - name: created
    type: date
    required: false
  - name: updated
    type: date
    required: false
  - name: sources
    type: integer
    required: false

  # --- registro autoritativo (anti-hallucination) ------------------------
  # `doc_register` ∈ {operational, conceptual, mixed} è iniettato a
  # ingest time da `ingest_raw/register.py:infer_doc_register` sulla
  # base di `source_type`. Letto a retrieval time dal RAG agent (vedi
  # `agents/intent_classifier.majority_register_from_hits`) per il
  # mismatch scope-detection. SENZA questa dichiarazione il payload
  # Qdrant non lo riceve e la difesa cade silenziosamente.
  - name: doc_register
    type: string
    required: false
    enum: [operational, conceptual, mixed]

  # --- source-specific ---------------------------------------------------
  - name: source_file
    type: string
    page_types: [source]
  - name: source_type
    type: string
    page_types: [source]
  - name: source_hash
    type: string
    page_types: [source]
  - name: ingested
    type: date
    page_types: [source]

extra: {}
