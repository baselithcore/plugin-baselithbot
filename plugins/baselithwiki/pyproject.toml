# Root marker for the vendored wiki engine.
#
# This file is intentionally minimal. The engine's
# `llm_wiki.admin.scaffold.paths.repo_root()` locates its project root by
# walking up for the first directory that contains BOTH `pyproject.toml` AND
# `domains/`. Inside the plugin that directory is `plugins/baselithwiki/`, so
# this marker pins scaffold/vault path resolution to the plugin tree instead of
# accidentally resolving to the host BaselithCore root. Not built as a package
# (the host wheel ships the vendored source as package-data).
[project]
name = "baselithwiki-vendored-engine"
version = "0.1.0"
description = "Vendored wiki-white-label engine (do not build standalone)."
requires-python = ">=3.12"
