name: baselithwiki
version: 0.1.0
description: "White-label LLM wiki engine \u2014 domain-agnostic RAG chat, PDF\u2192\
  wiki ingestion, hybrid Qdrant retrieval, optional knowledge graph and multi-tenant\
  \ auth \u2014 embedded as a self-contained sub-application with its React/Vite SPA."
author: BaselithCore Team
license: Apache-2.0
category: knowledge
readiness: alpha
tags:
- wiki
- rag
- ingestion
- qdrant
- knowledge-base
- white-label
homepage: https://baselithcore.xyz/plugins/baselithwiki
min_core_version: 1.0.0
required_resources:
- llm
optional_resources:
- postgres
- qdrant
- redis
- graph
python_dependencies:
- python-dotenv>=1.0.0
- pydantic>=2.5.2
- fastapi>=0.110.0
- uvicorn>=0.29.0
- qdrant-client>=1.12.0
- sentence-transformers>=2.7.0
- openai>=1.40.0
- ollama>=0.3.0
- psycopg[binary,pool]>=3.1.0
- alembic>=1.13.0
- pyjwt>=2.8.0
- pyyaml>=6.0
- jinja2>=3.1.0
plugin_dependencies: {}
environment_variables:
- BASELITHWIKI_APP_DOMAIN
- BASELITHWIKI_POSTGRES_ENABLED
- BASELITHWIKI_AUTH_REQUIRED
- BASELITHWIKI_LLM_VENDOR
- BASELITHWIKI_OLLAMA_URL
- BASELITHWIKI_OLLAMA_MODEL
- BASELITHWIKI_OPENAI_API_KEY
- BASELITHWIKI_WIKI_ROOT
