
services:
  # Main service: API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile-slim
    container_name: baselith-core-api
    env_file: configs/.env.production
    environment:
      - APP_ENV=production
      - ENVIRONMENT=production
      - CORE_LOG_FORMAT=json
      - HOST=0.0.0.0
      - PORT=8000
      # Uvicorn worker count (6 vCPU / 12 GB VPS). RAM-bound: ~2G/worker.
      # Keep api memory limit >= WEB_CONCURRENCY * 2G + 1G headroom.
      - WEB_CONCURRENCY=3
      - DOCKER_HOST=tcp://${SANDBOX_DOCKER_HOST:?SANDBOX_DOCKER_HOST must be set}
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
      - TELEMETRY_OTEL_ENDPOINT=http://jaeger:4317
      - SENTRY_DSN=${SENTRY_DSN}
      # env_file (configs/.env.production) is a template whose ${...} entries are NOT
      # interpolated by env_file loading — they would reach the app as literal strings.
      # These environment: overrides ARE interpolated by compose (from the gitignored
      # root .env), so real secrets stay out of git. DB_* must match the postgres init
      # (defaults baselithcore); the app's built-in default DB user is "baselith".
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-baselithcore}
      - DB_NAME=${DB_NAME:-baselithcore}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - VECTORSTORE_QDRANT_HOST=qdrant
      - SUPERMEMORY_ENABLED=false
      - SUPERMEMORY_API_KEY=
      - LLM_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - API_KEY=${API_KEY:-}
      - ADMIN_PASS_HASHED=${ADMIN_PASS_HASHED:-}
    volumes:
      - ${SANDBOX_CERTS_DIR:-./deploy/sandbox/client-certs}:/certs/client:ro
      - ./data:/app/data
    networks:
      - app_net
      - obs_net
    depends_on:
      - falkordb
      - postgres
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 6G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cache and Message Queue
  # Graph Database and Cache (Redis compatible)
  falkordb:
    image: falkordb/falkordb:latest
    container_name: baselith-falkordb
    volumes:
      - falkordb_data:/data
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1G
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Relational Database
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-baselithcore}
      - POSTGRES_USER=${DB_USER:-baselithcore}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official postgres entrypoint starts as root to chmod the data dir and
    # then drops to the unprivileged `postgres` user via su-exec. With cap_drop
    # ALL it cannot chown/chmod or switch user ("Operation not permitted"), so
    # restore exactly the caps that bootstrap needs — nothing more.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d ${DB_NAME:-baselithcore} -U ${DB_USER:-baselithcore}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker for Async Tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile-slim
    # No container_name: incompatible with deploy.replicas (names must be unique).
    env_file: configs/.env.production
    command: python -m core.task_queue.worker
    environment:
      - APP_ENV=production
      - ENVIRONMENT=production
      - CORE_LOG_FORMAT=json
      - DOCKER_HOST=tcp://${SANDBOX_DOCKER_HOST:?SANDBOX_DOCKER_HOST must be set}
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
      - TELEMETRY_OTEL_ENDPOINT=http://jaeger:4317
      - SENTRY_DSN=${SENTRY_DSN}
      # See api service: override the env_file template's literal ${...} placeholders
      # with compose-interpolated values (real secrets from the gitignored root .env).
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-baselithcore}
      - DB_NAME=${DB_NAME:-baselithcore}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - VECTORSTORE_QDRANT_HOST=qdrant
      - SUPERMEMORY_ENABLED=false
      - SUPERMEMORY_API_KEY=
      - LLM_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - API_KEY=${API_KEY:-}
      - ADMIN_PASS_HASHED=${ADMIN_PASS_HASHED:-}
    volumes:
      - ${SANDBOX_CERTS_DIR:-./deploy/sandbox/client-certs}:/certs/client:ro
      - ./data:/app/data
    networks:
      - app_net
      - obs_net
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    # The worker runs an RQ loop, not an HTTP server, so the image's default
    # curl /health probe always fails. Check the worker process is alive in THIS
    # container instead (its cmdline carries core.task_queue.worker as a distinct arg;
    # the probe's own `python -c` code does not, so it never matches itself).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys\ndef alive():\n    for p in os.listdir('/proc'):\n        if not p.isdigit():\n            continue\n        try:\n            if b'core.task_queue.worker' in open('/proc/' + p + '/cmdline', 'rb').read().split(b'\\0'):\n                return True\n        except Exception:\n            pass\n    return False\nsys.exit(0 if alive() else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    restart: unless-stopped
    deploy:
      replicas: 2          # limits below are PER replica → 2 x 1.5G = 3G total
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G

  # Reverse Proxy
  gateway:
    image: nginx:alpine
    container_name: baselith-gateway
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app_net
    depends_on:
      - api
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx.conf uses `user nginx;`, so the root master chowns its cache temp dirs
    # to uid 101 and forks workers as that user. With cap_drop ALL that chown/setuid
    # fails ("chown ... Operation not permitted"); restore exactly the caps the
    # bootstrap needs — CHOWN for the cache dirs, SET{U,G}ID to drop workers to nginx,
    # NET_BIND_SERVICE to bind :80 — nothing more.
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp:size=32m,noexec,nosuid
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # === Observability Stack ===
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: baselith-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - obs_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: baselith-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app_net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  falkordb_data:
  postgres_data:
  prometheus_data:

networks:
  app_net:
  obs_net:
