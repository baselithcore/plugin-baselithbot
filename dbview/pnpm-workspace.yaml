packages:
  - 'apps/*'
  - 'packages/*'
# pnpm >= 11 refuses to run dependency build scripts unless explicitly
# approved here. These are the native/postinstall deps dbview needs compiled
# (argon2 for password hashing, better-sqlite3 for the SQLite engine and
# dump import, esbuild/swc for the toolchain, oracledb optional client).
allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  argon2: true
  better-sqlite3: true
  esbuild: true
  oracledb: true
  protobufjs: true
