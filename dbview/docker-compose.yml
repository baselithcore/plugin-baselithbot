name: dbview

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: shop_admin
      POSTGRES_PASSWORD: shop_admin_password
    ports:
      - '${POSTGRES_HOST_PORT:-55433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop_admin -d shopdb']
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - '57474:7474'
      - '57687:7687'
    volumes:
      - neo4jdata:/data
    profiles: ['graph']
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - '56379:6379'
      - '53000:3000'
    volumes:
      - falkordata:/data
    profiles: ['graph']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama:/root/.ollama
    profiles: ['llm']

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo_admin_password}
    ports:
      - '57017:27017'
    volumes:
      - mongodata:/data/db
    profiles: ['document']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '56380:6379'
    volumes:
      - redisdata:/data
    profiles: ['keyvalue']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '59200:9200'
    volumes:
      - esdata:/usr/share/elasticsearch/data
    profiles: ['search']
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health | grep -E "(green|yellow)"']
      interval: 10s
      timeout: 5s
      retries: 15

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '56333:6333'
      - '56334:6334'
    volumes:
      - qdrantdata:/qdrant/storage
    profiles: ['vector']
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:6333/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      APP_VERSION: ${APP_VERSION:-dev}
      DBVIEW_SECRET: ${DBVIEW_SECRET:-dev-secret-change-me-min-16chars}
      DBVIEW_API_KEY: ${DBVIEW_API_KEY:-}
      DBVIEW_DATA_DIR: /data
      DBVIEW_BODY_LIMIT: ${DBVIEW_BODY_LIMIT:-}
      DBVIEW_HISTORY_MAX: ${DBVIEW_HISTORY_MAX:-}
      DBVIEW_JWT_SECRET: ${DBVIEW_JWT_SECRET:?DBVIEW_JWT_SECRET is required (min 32 chars)}
      DBVIEW_JWT_ACCESS_TTL: ${DBVIEW_JWT_ACCESS_TTL:-}
      DBVIEW_JWT_REFRESH_TTL: ${DBVIEW_JWT_REFRESH_TTL:-}
      DBVIEW_ADMIN_EMAIL: ${DBVIEW_ADMIN_EMAIL:-}
      DBVIEW_ADMIN_PASSWORD: ${DBVIEW_ADMIN_PASSWORD:-}
      DBVIEW_ALLOW_REGISTRATION: ${DBVIEW_ALLOW_REGISTRATION:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-dbview-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/api}
      OLLAMA_MODEL_SQL: ${OLLAMA_MODEL_SQL:-codellama:7b}
      OLLAMA_MODEL_GRAPH: ${OLLAMA_MODEL_GRAPH:-codellama:7b}
      OLLAMA_MODEL_DOCUMENT: ${OLLAMA_MODEL_DOCUMENT:-codellama:7b}
      OLLAMA_MODEL_KEYVALUE: ${OLLAMA_MODEL_KEYVALUE:-codellama:7b}
      OLLAMA_MODEL_SEARCH: ${OLLAMA_MODEL_SEARCH:-codellama:7b}
      OLLAMA_MODEL_VECTOR: ${OLLAMA_MODEL_VECTOR:-codellama:7b}
      OLLAMA_MODEL_EXPLAIN: ${OLLAMA_MODEL_EXPLAIN:-codellama:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_MODEL_EXPLAIN: ${OPENAI_MODEL_EXPLAIN:-${OPENAI_MODEL:-gpt-4o-mini}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_MODEL_EXPLAIN: ${ANTHROPIC_MODEL_EXPLAIN:-${ANTHROPIC_MODEL:-claude-sonnet-4-6}}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3001:3001'
    volumes:
      - apidata:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - '8088:8080'
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  apidata:
  neo4jdata:
  falkordata:
  mongodata:
  redisdata:
  esdata:
  qdrantdata:
