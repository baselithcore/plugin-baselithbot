[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baselith-core"
dynamic = ["version"]
description = "A Modular Framework for Baselith-Core Orchestration featuring World Models (MCTS), Swarm, and Native MCP."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Gippo", email = "baselith.ai@gmail.com" }
]
license = "AGPL-3.0-only"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ai", "agents", "framework"]

dependencies = [
  "aiohttp>=3.9.0",
  "alembic>=1.13.0",
  "anthropic>=0.18.0",
  "argon2-cffi>=23.1.0",
  "defusedxml==0.7.1",
  "email-validator>=2.1.0",
  "fastapi==0.115.0",
  "fastapi-limiter<0.2.0,>=0.1.6",
  "httpx==0.27.0",
  "jsonschema>=4.23.0",
  "langchain-text-splitters>=1.1.0",
  "markdown-it-py==3.0.0",
  "networkx>=3.0",
  "numpy>=1.24.0",
  "ollama==0.6.0",
  "openai>=2.2.0",
  "opentelemetry-api>=1.21.0",
  "opentelemetry-exporter-otlp>=1.21.0",
  "opentelemetry-instrumentation-fastapi>=0.42b0",
  "opentelemetry-instrumentation-httpx>=0.42b0",
  "opentelemetry-instrumentation-redis>=0.42b0",
  "opentelemetry-sdk>=1.21.0",
  "orjson==3.11.7",
  "prometheus-client==0.20.0",
  "psycopg[binary,pool]==3.2.1",
  "pydantic-settings>=2.0.0",
  "PyJWT>=2.10.1,<3.0",
  "python-multipart",
  "PyYAML>=6.0",
  "qdrant-client==1.15.1",
  "redis==5.0.7",
  "rq>=1.15.0",
  "sentry-sdk[fastapi]>=2.0.0",
  "sse-starlette>=2.1.0",
  "structlog>=24.1.0",
  "uvicorn[standard]==0.30.0",
  "rich>=13.7.0",
  "rich-argparse>=1.4.0",
  "argcomplete>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/baselithcore/baselithcore"
Repository = "https://github.com/baselithcore/baselithcore"
Documentation = "https://baselithcore.github.io/baselithcore"

[project.scripts]
baselith = "core.cli.__main__:main"

[project.optional-dependencies]
browser = [
  "playwright==1.45.0",
]
documents = [
  "pypdf>=6.7.4",
  "python-docx==1.1.0",
  "python-pptx==0.6.23",
  "openpyxl==3.1.5",
  "xlrd==2.0.1",
]
ocr = [
  "pdf2image==1.16.3",
  "Pillow==12.1.1",
  "pytesseract==0.3.10",
]
web = [
  "beautifulsoup4>=4.14.2",
  "playwright==1.45.0",
]
rag = [
  "sentence-transformers==2.7.0",
]
nlp = [
  "spacy==3.8.0",
]
huggingface = [
  "huggingface-hub>=0.20.0",
  "transformers>=4.36.0",
  "accelerate>=0.25.0",
]
test = [
  "beautifulsoup4>=4.14.2",
  "pypdf>=6.7.4",
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.21.0",
  # Required by `plugins/baselithbot/security/secret_store.py` (Fernet) —
  # imported transitively when monorepo CI collects plugin test modules.
  "cryptography>=42.0.0",
]
dev = [
  "beautifulsoup4>=4.14.2",
  "pypdf>=6.7.4",
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "ipython>=8.0.0",
  "pre-commit>=3.5.0",
  "types-PyYAML",
]
adapters = [
  "langchain>=1.2.0",
  "langchain-community>=0.4.0",
  "langgraph>=1.0.0",
  "langchain-ollama>=1.0.0",
]
memory = [
  "supermemory>=0.1.0",
]
computer_use = [
  "mss>=9.0.0",
  "Pillow==12.1.1",
  "pyautogui>=0.9.54",
]
auth = [
  # TOTP/MFA for the auth plugin (plugins/auth/mfa.py).
  "pyotp>=2.9.0",
  # QR-code rendering for MFA enrollment (mfa.get_qr_code_base64). The [pil]
  # extra pulls Pillow so PNG generation works; without it MFA setup degrades
  # to manual-key entry only (no QR shown).
  "qrcode[pil]>=7.4",
  # WebAuthn / passkeys (plugins/auth/webauthn.py). Degrades gracefully if absent.
  "webauthn>=2.0.0",
  # SAML 2.0 SSO (plugins/auth/sso/saml.py). Degrades gracefully if absent.
  "python3-saml>=1.16.0",
]
pitwall = [
  # Live websocket telemetry adapter (plugins/baselith_pitwall/ingestion/
  # _websocket.py). The file/UDP/simulated sources need no extra deps; the
  # adapter degrades to a no-op when this is absent.
  "websockets>=12.0",
]
honeypot = [
  # SSH honeypot listener + HTTP callbacks.
  "asyncssh>=2.13.0",
  "aiohttp>=3.8.0",
  # Live CVE intelligence via NVD API (services/cve_service.py).
  "nvdlib>=0.7.0",
  # honeypot's router guards routes with the auth plugin (require_roles).
  "pyotp>=2.9.0",
]
red_agent = [
  # gRPC daemon fleet transport (plugins/red_agent/grpc/, proto/_generated/).
  # The committed stubs pin GRPC_GENERATED_VERSION; keep this floor in sync
  # with the grpcio-tools used by proto/build.sh when regenerating.
  "grpcio>=1.78.0",
  "grpcio-tools>=1.78.0",
  "protobuf>=5.27.0",
  # FalkorDB graph backend for the vulnerability graph (graph.py,
  # _plugin_lifecycle.py build_graph_client()).
  "falkordb>=1.0.0",
  # Ed25519 CA + agent enrollment certificates (crypto/ca.py).
  "cryptography>=42.0.0",
  # ML false-positive classifier + anomaly detector (ml/models/*, lazy-imported).
  "scikit-learn>=1.3.0",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "plugins*"]

[tool.setuptools.dynamic]
version = {attr = "core._version.__version__"}

[tool.setuptools.package-data]
"*" = [
    "static/**/*",
    "ui/dist/**/*",
    "ui/out/**/*",
    "ui/.next/**/*",
    "manifest.yaml",
    "manifest.yml",
    "manifest.json",
    "README.md",
    "py.typed",
    "lexicons/*.yaml",
    "lexicons/*.yml",
    "prompts/*.md",
    # Backend i18n message catalogs (e.g. baselithtwin/locales/{en,it}.json).
    "locales/*.json",
    # BaselithWiki: compiled SPA + vendored engine data (domain packs and
    # Alembic migrations are loaded from disk, not import, so they ship as
    # package-data). ``llm_wiki`` itself is pure-Python and ships as code.
    "frontend/dist/**/*",
    "domains/**/*",
    "alembic/**/*",
    "alembic.ini",
]
[tool.setuptools.exclude-package-data]
# BaselithWiki: only the compiled SPA (``frontend/dist/**``) ships. The
# TypeScript source, node_modules and build config are excluded; operators
# rebuild via ``npm run build`` only when they fork the plugin. Runtime data
# (vaults, qdrant_data, logs) and the egg-info marker never ship.
baselithwiki = [
    "frontend/node_modules/**",
    "frontend/components/**",
    "frontend/contexts/**",
    "frontend/hooks/**",
    "frontend/lib/**",
    "frontend/pages/**",
    "frontend/types/**",
    "frontend/embed/**",
    "frontend/embed-loader/**",
    "frontend/public/**",
    "frontend/tests/**",
    "frontend/*.ts",
    "frontend/*.tsx",
    "frontend/*.json",
    "frontend/*.css",
    "frontend/*.html",
    "frontend/*.mjs",
    "vaults/**",
    "qdrant_data/**",
    "logs/**",
    "tests/**",
]
# Only the compiled SPA (``ui/dist/**``) ships in the confessgpt wheel.
# The TypeScript source and node_modules are excluded — operators
# rebuild via ``npm run build`` only when they fork the plugin.
confessgpt = [
    "ui/src/**",
    "ui/node_modules/**",
    "ui/*.config.ts",
    "ui/*.config.js",
    "ui/tsconfig*.json",
    "ui/package.json",
    "ui/package-lock.json",
    "ui/index.html",
    "ui/postcss.config.js",
    "ui/tailwind.config.ts",
    "tests/**",
]
# BaselithBrain: only the compiled SPA (``ui/dist/**``) ships. TypeScript
# source + node_modules are excluded; the runtime Markdown vault never ships.
baselithbrain = [
    "ui/src/**",
    "ui/node_modules/**",
    "ui/*.config.ts",
    "ui/tsconfig*.json",
    "ui/package.json",
    "ui/package-lock.json",
    "ui/index.html",
    "vault/**",
    "tests/**",
]
# BaselithOptimizeProcess: only the compiled SPA (``ui/dist/**``) ships. The
# React/Vite source + node_modules are excluded; operators rebuild via
# ``npm run build`` only when they fork the plugin.
baselithoptimizeprocess = [
    "ui/src/**",
    "ui/node_modules/**",
    "ui/*.config.ts",
    "ui/*.config.js",
    "ui/tsconfig*.json",
    "ui/tsconfig.tsbuildinfo",
    "ui/package.json",
    "ui/package-lock.json",
    "ui/index.html",
    "tests/**",
]
# BaselithTwin: only the compiled SPA (``ui/dist/**``) ships. The React/Vite
# source + node_modules are excluded; operators rebuild via ``npm run build``
# only when they fork the plugin. The backend ``locales/*.json`` catalogs DO
# ship (matched by the global package-data ``locales/*.json`` rule).
baselithtwin = [
    "ui/src/**",
    "ui/node_modules/**",
    "ui/*.config.ts",
    "ui/*.config.js",
    "ui/tsconfig*.json",
    "ui/tsconfig.tsbuildinfo",
    "ui/package.json",
    "ui/package-lock.json",
    "ui/index.html",
    "tests/**",
]
# BaselithControl: only the compiled SPA (``ui/dist/**``) ships. The React/Vite
# source + node_modules are excluded; operators rebuild via ``npm run build``
# only when they fork the plugin. Backend ``locales/*.json`` catalogs DO ship
# (matched by the global package-data ``locales/*.json`` rule).
baselithcontrol = [
    "ui/src/**",
    "ui/node_modules/**",
    "ui/*.config.ts",
    "ui/*.config.js",
    "ui/tsconfig*.json",
    "ui/tsconfig.tsbuildinfo",
    "ui/package.json",
    "ui/package-lock.json",
    "ui/index.html",
    "tests/**",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", "node_modules", ".git", ".env", "examples"]

[tool.ruff]
target-version = "py312"
force-exclude = true
exclude = [
    "templates/",
    "frontend/",
    "examples/",
    # Generated protobuf/gRPC stubs (tool output, regenerated by
    # plugins/red_agent/proto/build.sh) — not hand-maintained source.
    "**/proto/_generated/",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
disable_error_code = ["import-untyped", "import-not-found"]
exclude = [
    "templates/",
    "examples/",
    "frontend/",
    "build/",
    "dist/",
    "plugins/",
    "scripts/",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers",
    "psutil",
    "pytesseract",
    "docker",
    "docker.errors",
    "docker.models.containers",
    "docker.types",
    "structlog",
    "structlog.contextvars",
    "opentelemetry",
    "opentelemetry.instrumentation.fastapi",
    "opentelemetry.instrumentation.redis",
    "opentelemetry.instrumentation.httpx",
    "supermemory",
    "supermemory.*",
]
ignore_errors = true
